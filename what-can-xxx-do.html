}

}
function addImpression() {

}
function addScore() {

}
function addUseCase() {

}
function addCoverBadge() {
  DATA.cover.badges.push('新标签')
  renderSettings()
}

  DATA.cta.features.push({ num: '10x', lbl: '效率提升' })

function deleteItem(arr, idx) {
  const keys = arr.split('.')
  let obj = DATA
  for (let i = 0; i < keys.length; i++) obj = obj[keys[i]]
  obj.splice(idx, 1)
  renderSettings()
}

function deleteCoverBadge(idx) {
  DATA.cover.badges.splice(idx, 1)
  renderSettings()
}

function deleteCtaFeature(idx) {
  DATA.cta.features.splice(idx, 1)
  renderSettings()
}

function editCode(idx) {
  window._codeToEdit = idx
  const v = DATA.practices.items[idx].code
  const ta = prompt('编辑代码内容（支持换行）：', v)
  if (ta !== null) {
    DATA.practices.items[idx].code = ta
    applySettings()
  }
}

function collectSettings() {
  document.querySelectorAll('#settingsBody [data-path]').forEach(el => {
    const path = el.dataset.path.split('.')
    let obj = DATA
    for (let i = 0; i < path.length - 1; i++) {
      if (obj == null) return
      obj = obj[path[i]]
    }
    if (obj == null) return
    let val = el.type === 'number' ? parseFloat(el.value) || 0 : el.value
    obj[path[path.length - 1]] = val
  })
}

function applySettings() {
  try {
    collectSettings()
    saveData()
    rebuild()
    closeSettings()
  } catch (e) {
    alert('应用失败：' + e.message)
    console.error(e)
  }
}

function resetData() {
  if (confirm('确定恢复默认内容？当前修改将丢失。')) {
    localStorage.removeItem(STORAGE_KEY)
    location.reload()
  }
}

function rebuild() {
  const s = renderSlides()
  stage.innerHTML = s.join('')
  const total = s.length

  navDots.innerHTML = Array.from({ length: total }, (_, i) =>
    `<button class="nav-dot${i === 0 ? ' active' : ''}" data-index="${i}"></button>`
  ).join('')

  if (current >= total) current = total - 1
  document.querySelectorAll('.slide').forEach((el, i) => {
    el.classList.toggle('active', i === current)
  })
  document.querySelectorAll('.nav-dot').forEach((el, i) => {
    el.classList.toggle('active', i === current)
  })
  counter.textContent = `${current + 1} / ${total}`
  window._totalSlides = total
}

function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('open')
}

const STORAGE_KEY = 'what-can-xxx-do-data-v2'
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY)
    if (raw) {
      const saved = JSON.parse(raw)
      deepMerge(DATA, saved)
    }
  } catch (_) {}
}

function deepMerge(target, source) {
  Object.keys(source).forEach(k => {
    if (Array.isArray(source[k])) {
      target[k] = source[k]
    } else if (typeof source[k] === 'object' && source[k] !== null && typeof target[k] === 'object') {
      deepMerge(target[k], source[k])
    } else {
      target[k] = source[k]
    }
  })
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA))
}

// Migrate old storage key
try {
  const oldRaw = localStorage.getItem('what-can-xxx-do-data')
  if (oldRaw) {
    const old = JSON.parse(oldRaw)
    if (old.features && Array.isArray(old.features) && !localStorage.getItem(STORAGE_KEY)) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        cover: old.cover || DATA.cover,
        features: { title: DATA.features.title, desc: DATA.features.desc, items: old.features },
        practices: { title: DATA.practices.title, desc: DATA.practices.desc, items: old.practices },
        impressions: { title: DATA.impressions.title, desc: DATA.impressions.desc, items: old.impressions },
        scores: { title: DATA.scores.title, desc: DATA.scores.desc, items: old.scores },
        usecases: DATA.usecases,
        cta: DATA.cta,
      }))
    }
  }
} catch (_) {}

loadData()

const stage = document.getElementById('stage')
let current = 0

const navDots = document.getElementById('navDots')
const counter = document.getElementById('navCounter')

rebuild()

function goTo(index) {
  const total = window._totalSlides || document.querySelectorAll('.slide').length
  if (index < 0 || index >= total) return
  document.querySelectorAll('.slide').forEach((el, i) => {
    el.classList.toggle('active', i === index)
  })
  document.querySelectorAll('.nav-dot').forEach((el, i) => {
    el.classList.toggle('active', i === index)
  })
  current = index
  counter.textContent = `${current + 1} / ${total}`
}

document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1))
document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1))
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(current - 1)
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') goTo(current + 1)
})
navDots.addEventListener('click', e => {
  const dot = e.target.closest('.nav-dot')
  if (dot) goTo(parseInt(dot.dataset.index))
})

document.getElementById('settingsBtn').addEventListener('click', () => {
  renderSettings()
  document.getElementById('settingsOverlay').classList.add('open')
})
document.getElementById('settingsReset').addEventListener('click', resetData)
document.getElementById('settingsCancel').addEventListener('click', closeSettings)
document.getElementById('settingsApply').addEventListener('click', applySettings)
document.getElementById('settingsOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeSettings()
})

function scale() {
  const sw = 1920, sh = 1080
  const sx = window.innerWidth / sw, sy = window.innerHeight / sh
  const s = Math.min(sx, sy)
  stage.style.transform = `scale(${s})`
  stage.style.transformOrigin = '0 0'
  const top = (window.innerHeight - sh * s) / 2
  stage.style.marginTop = top > 0 ? `${top}px` : '0'
}
window.addEventListener('resize', scale)
scale()
</script>
