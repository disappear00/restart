<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="高保真交互式个人作品集网站，包含 SPA 路由、主题切换、粒子首屏、项目筛选、联系表单、PWA 与中英双语支持。"
  />
  <meta name="theme-color" content="#f5efe4" />
  <title>Lin Portfolio Lab</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles/base.css" />
</head>
<body>
  <a class="skip-link" href="#app">跳到主要内容</a>

  <div class="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <div class="site-shell">
    <header class="site-header" id="site-header"></header>

    <aside class="mobile-menu" id="mobile-menu" aria-hidden="true"></aside>

    <main id="app" tabindex="-1" aria-live="polite"></main>

    <footer class="site-footer">
      <p data-i18n="footer.note">用原生 JavaScript 打造的交互式作品集实验室。</p>
      <p class="footer-meta">© <span id="footer-year"></span> Lin Portfolio Lab</p>
    </footer>
  </div>

  <button
    class="back-to-top"
    id="back-to-top"
    type="button"
    aria-label="回到顶部"
    title="回到顶部"
  >
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <circle class="progress-track" cx="24" cy="24" r="20"></circle>
      <circle class="progress-value" cx="24" cy="24" r="20"></circle>
    </svg>
    <span>↑</span>
  </button>

  <div id="modal-root" aria-live="polite"></div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="live-region" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
  <div id="chatbot-root"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
