<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XXX 可以做什么？</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f5f0f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif
    }

    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      transform-origin: 0 0;
      overflow: hidden;
      background: #fcfbfa;
      margin: 0 auto
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px 120px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .7s cubic-bezier(.22, 1, .36, 1), transform .7s cubic-bezier(.22, 1, .36, 1);
      transform: scale(.97) translateY(20px)
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) translateY(0)
    }

    .bg-white {
      background: #fcfbfa
    }

    .bg-pink {
      background: #fdf2f4
    }

    .bg-blue {
      background: #f0f4ff
    }

    .bg-warm {
      background: #faf6f0
    }

    .bg-dark {
      background: #2d2a27
    }

    .bg-rose {
      background: linear-gradient(135deg, #fdf2f4 0%, #fcfbfa 40%, #f0f4ff 100%)
    }

    .bg-coral {
      background: linear-gradient(135deg, #f0f4ff 0%, #fcfbfa 40%, #fdf2f4 100%)
    }

    h1 {
      font-size: 74px;
      font-weight: 700;
      color: #1c1917;
      letter-spacing: -2px;
      line-height: 1.12
    }

    h2 {
      font-size: 42px;
      font-weight: 600;
      color: #1c1917;
      letter-spacing: -.5px;
      line-height: 1.2
    }

    .slide[style*="color"] h1,
    .slide[style*="color"] h2,
    .slide[style*="color"] .pg-desc,
    .slide[style*="color"] .cover-sub,
    .slide[style*="color"] .feat-card h3,
    .slide[style*="color"] .feat-card p,
    .slide[style*="color"] .prac-card h3,
    .slide[style*="color"] .prac-card p,
    .slide[style*="color"] .score-label,
    .slide[style*="color"] .score-val,
    .slide[style*="color"] .usecase-card h3,
    .slide[style*="color"] .usecase-card p,
    .slide[style*="color"] .cta-title,
    .slide[style*="color"] .cta-sub,
    .slide[style*="color"] .impr-quote,
    .slide[style*="color"] .impr-author strong,
    .slide[style*="color"] .cta-feature .lbl,
    .slide[style*="color"] .cover-badge,
    .slide[style*="color"] .usecase-tag {
      color: inherit
    }

    .accent {
      color: #e11d48
    }

    .page-tag {
      display: inline-block;
      background: #e11d48;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 16px;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      text-transform: uppercase;
      box-shadow: 4px 4px 0 rgba(225, 29, 72, .2)
    }

    .pg-title {
      margin-bottom: 12px;
      text-align: center
    }

    .pg-desc {
      font-size: 17px;
      color: #a8a29e;
      margin-bottom: 40px;
      text-align: center;
      max-width: 680px;
      line-height: 1.7;
      font-weight: 400
    }

    .divider {
      width: 50px;
      height: 4px;
      background: #e11d48;
      margin: 20px auto 0
    }

    /* Wavy underline decoration */
    .wavy {
      position: relative;
      display: inline-block
    }

    .wavy::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: -4px;
      right: -4px;
      height: 8px;
      background: url("data:image/svg+xml,%3Csvg width='100' height='8' viewBox='0 0 100 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 4 C10 0 20 8 30 4 C40 0 50 8 60 4 C70 0 80 8 90 4 L100 4' stroke='%23e11d48' stroke-width='1.5' fill='none' opacity='.35'/%3E%3C/svg%3E") repeat-x;
      background-size: 50px 8px
    }

    /* Decorative blobs */
    .blob {
      position: absolute;
      pointer-events: none;
      z-index: 0;
      border-radius: 50%
    }

    .blob-1 {
      top: -160px;
      right: -140px;
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, rgba(225, 29, 72, .06) 0%, transparent 65%);
      animation: blobDrift 8s ease-in-out infinite
    }

    .blob-2 {
      bottom: -140px;
      left: -120px;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(225, 29, 72, .04) 0%, transparent 65%);
      animation: blobDrift 10s ease-in-out infinite reverse
    }

    .blob-3 {
      top: 50%;
      left: -180px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(147, 197, 253, .06) 0%, transparent 65%);
      transform: translateY(-50%);
      animation: blobDrift 9s ease-in-out infinite
    }

    .blob-4 {
      bottom: -80px;
      right: -100px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(225, 29, 72, .03) 0%, transparent 65%);
      animation: blobDrift 11s ease-in-out infinite reverse
    }

    .blob-5 {
      top: -60px;
      left: -60px;
      width: 180px;
      height: 180px;
      border: 2px solid rgba(225, 29, 72, .06);
      animation: blobFloat 7s ease-in-out infinite
    }

    .blob-6 {
      bottom: -40px;
      right: -40px;
      width: 140px;
      height: 140px;
      border: 2px solid rgba(147, 197, 253, .06);
      animation: blobFloat 9s ease-in-out infinite reverse
    }

    .blob-7 {
      top: 140px;
      right: -120px;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(147, 197, 253, .05) 0%, transparent 65%);
      animation: blobDrift 8s ease-in-out infinite
    }

    @keyframes blobDrift {

      0%,
      100% {
        opacity: .6;
        transform: scale(1)
      }

      50% {
        opacity: 1;
        transform: scale(1.06)
      }
    }

    @keyframes blobFloat {

      0%,
      100% {
        transform: translate(0, 0)
      }

      50% {
        transform: translate(16px, -16px)
      }
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-100%)
      }

      100% {
        transform: translateX(100%)
      }
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(20px)scale(.97)
      }

      to {
        opacity: 1;
        transform: translateY(0)scale(1)
      }
    }

    .dot-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: .04;
      background-image: radial-gradient(#d4d4d8 1px, transparent 1px);
      background-size: 32px 32px
    }

    /* ─── Slide 1: Cover ─── */
    .cover {
      overflow: hidden;
      padding: 0 120px
    }

    .cover::before {
      content: '';
      position: absolute;
      top: -240px;
      right: -200px;
      width: 650px;
      height: 650px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(225, 29, 72, .07) 0%, transparent 60%);
      animation: blobDrift 7s ease-in-out infinite
    }

    .cover::after {
      content: '';
      position: absolute;
      bottom: -160px;
      left: -160px;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(147, 197, 253, .06) 0%, transparent 60%);
      animation: blobDrift 9s ease-in-out infinite reverse
    }

    .cover-sub {
      font-size: 22px;
      color: #a8a29e;
      margin-top: 16px;
      text-align: center;
      max-width: 760px;
      line-height: 1.6;
      font-weight: 400
    }

    .product-name {
      color: #e11d48
    }

    .cover-badges {
      display: flex;
      gap: 10px;
      margin-top: 44px;
      flex-wrap: wrap;
      justify-content: center
    }

    .cover-badge {
      padding: 8px 22px;
      font-size: 13px;
      font-weight: 600;
      color: #57534e;
      background: #fff;
      border: 2px solid #e7e5e4;
      transition: all .25s ease;
      box-shadow: 4px 4px 0 #e7e5e4
    }

    .cover-badge:hover {
      border-color: #e11d48;
      color: #e11d48;
      box-shadow: 4px 4px 0 rgba(225, 29, 72, .2);
      transform: translate(-2px, -2px)
    }

    /* ─── Slide 2: Features ─── */
    .feat-wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 1500px;
      position: relative;
      z-index: 1
    }

    .feat-card {
      background: #fff;
      padding: 28px 32px;
      border: 2px solid #e7e5e4;
      flex: 0 0 calc(50% - 10px);
      max-width: 680px;
      display: flex;
      align-items: flex-start;
      gap: 18px;
      transition: all .3s ease;
      box-shadow: 6px 6px 0 #e7e5e4
    }

    .feat-card:hover {
      border-color: #e11d48;
      box-shadow: 6px 6px 0 rgba(225, 29, 72, .2);
      transform: translate(-2px, -2px)
    }

    .feat-num {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      background: #fef2f2;
      color: #e11d48;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fecaca
    }

    .feat-card h3 {
      font-size: 22px;
      margin-bottom: 6px;
      color: #292524;
      font-weight: 600
    }

    .feat-card p {
      font-size: 16px;
      color: #a8a29e;
      line-height: 1.7;
      font-weight: 400
    }

    /* ─── Unified Card Attachment ─── */
    .card-attach {
      margin-top: 14px
    }

    .card-attach-img {
      border: 2px solid #e7e5e4;
      background: #fafaf9;
      overflow: hidden
    }

    .card-attach-img img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 280px;
      object-fit: contain
    }

    .card-attach-video {
      border: 2px solid #e7e5e4;
      background: #000;
      overflow: hidden
    }

    .card-attach-video video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 320px;
      object-fit: contain
    }

    .card-attach-code {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
      background: #fafaf9;
      padding: 14px 18px;
      color: #57534e;
      line-height: 1.7;
      white-space: pre-wrap;
      border-left: 4px solid #e11d48;
      border: 2px solid #e7e5e4;
      border-left-width: 4px
    }

    .feat-card .card-attach-img {
      border-color: #fecaca;
      background: #fef2f2
    }

    .feat-card .card-attach-img img {
      max-height: 200px
    }

    /* ─── Slide 3: Practice ─── */
    .prac-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      width: 100%;
      max-width: 1400px;
      position: relative;
      z-index: 1
    }

    .prac-card {
      background: #fff;
      padding: 32px;
      transition: all .3s ease;
      border: 2px solid #e7e5e4;
      box-shadow: 6px 6px 0 #e7e5e4
    }

    .prac-card:hover {
      border-color: #e11d48;
      box-shadow: 6px 6px 0 rgba(225, 29, 72, .2);
      transform: translate(-2px, -2px)
    }

    .prac-card .label {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: #e11d48;
      background: #fef2f2;
      padding: 3px 12px;
      margin-bottom: 12px;
      letter-spacing: .5px;
      border: 2px solid #fecaca
    }

    .prac-card h3 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #292524;
      font-weight: 600
    }

    .prac-card p {
      font-size: 15px;
      color: #a8a29e;
      line-height: 1.7;
      font-weight: 400
    }

    /* ─── Slide 4: Impressions ─── */
    .impr-wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 1400px;
      position: relative;
      z-index: 1
    }

    .impr-card {
      background: #fff;
      padding: 32px;
      border: 2px solid #e7e5e4;
      flex: 0 0 calc(50% - 10px);
      max-width: 650px;
      transition: all .3s ease;
      position: relative;
      box-shadow: 6px 6px 0 #e7e5e4
    }

    .impr-card:hover {
      border-color: #e11d48;
      box-shadow: 6px 6px 0 rgba(225, 29, 72, .2);
      transform: translate(-2px, -2px)
    }

    .impr-card::before {
      content: '"';
      position: absolute;
      top: 8px;
      left: 16px;
      font-size: 44px;
      color: #fecaca;
      font-weight: 700;
      line-height: 1;
      font-family: Georgia, serif
    }

    .impr-quote {
      font-size: 18px;
      line-height: 1.8;
      color: #57534e;
      font-style: italic;
      margin-bottom: 18px;
      font-weight: 400
    }

    .impr-author {
      font-size: 14px;
      color: #d6d3d1;
      font-style: normal
    }

    .impr-author strong {
      color: #a8a29e;
      font-weight: 600
    }

    /* ─── Slide 5: Scoring ─── */
    .score-wrap {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 1000px;
      position: relative;
      z-index: 1
    }

    .score-row {
      display: flex;
      align-items: center;
      gap: 20px
    }

    .score-label {
      width: 110px;
      font-size: 16px;
      font-weight: 600;
      color: #57534e;
      flex-shrink: 0;
      text-align: right
    }

    .score-bar-bg {
      flex: 1;
      height: 16px;
      background: #f5f5f4;
      border: 2px solid #e7e5e4;
      overflow: hidden
    }

    .score-bar-fill {
      height: 100%;
      background: #e11d48;
      transition: width 1.2s cubic-bezier(.22, 1, .36, 1);
      position: relative
    }

    .score-bar-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .15), transparent);
      animation: shimmer 2.5s infinite
    }

    .score-val {
      width: 36px;
      font-size: 18px;
      font-weight: 700;
      color: #e11d48;
      flex-shrink: 0;
      font-family: 'SF Mono', monospace
    }

    .score-total {
      margin-top: 28px;
      text-align: center
    }

    .score-total .big {
      font-size: 54px;
      font-weight: 700;
      color: #e11d48;
      font-family: 'SF Mono', monospace;
      letter-spacing: -4px;
      text-shadow: 3px 3px 0 #fecaca
    }

    .score-total .lbl {
      font-size: 15px;
      color: #d6d3d1;
      margin-top: 4px;
      font-weight: 500
    }

    /* ─── Slide 6: Use Cases ─── */
    .usecase-wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 1500px;
      position: relative;
      z-index: 1
    }

    .usecase-card {
      background: #fff;
      padding: 32px 28px;
      border: 2px solid #e7e5e4;
      flex: 0 0 calc(33.33% - 14px);
      max-width: 460px;
      text-align: center;
      transition: all .3s ease;
      box-shadow: 6px 6px 0 #e7e5e4
    }

    .usecase-card:hover {
      transform: translate(-3px, -3px);
      border-color: #e11d48;
      box-shadow: 6px 6px 0 rgba(225, 29, 72, .2)
    }

    .usecase-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      transition: transform .3s ease;
      border: 2px solid #e7e5e4;
      background: #fafaf9
    }

    .usecase-card:hover .usecase-icon {
      transform: scale(1.08)
    }

    .usecase-card:nth-child(1) .usecase-icon {
      border-color: #fecaca;
      background: #fef2f2
    }

    .usecase-card:nth-child(2) .usecase-icon {
      border-color: #bfdbfe;
      background: #eff6ff
    }

    .usecase-card:nth-child(3) .usecase-icon {
      border-color: #bbf7d0;
      background: #f0fdf4
    }

    .usecase-card:nth-child(4) .usecase-icon {
      border-color: #fde68a;
      background: #fffbeb
    }

    .usecase-card:nth-child(5) .usecase-icon {
      border-color: #ddd6fe;
      background: #f5f3ff
    }

    .usecase-card:nth-child(6) .usecase-icon {
      border-color: #fbcfe8;
      background: #fdf2f8
    }

    .usecase-card h3 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #292524;
      font-weight: 600
    }

    .usecase-card p {
      font-size: 14px;
      color: #a8a29e;
      line-height: 1.7;
      font-weight: 400
    }

    .usecase-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: #d6d3d1;
      background: #fafaf9;
      padding: 3px 12px;
      margin-top: 12px;
      border: 2px solid #e7e5e4
    }

    /* ─── Slide 7: CTA / Conclusion ─── */
    .cta {
      overflow: hidden
    }

    .cta::before {
      content: '';
      position: absolute;
      top: -280px;
      right: -200px;
      width: 650px;
      height: 650px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(225, 29, 72, .07) 0%, transparent 55%);
      animation: blobDrift 8s ease-in-out infinite
    }

    .cta::after {
      content: '';
      position: absolute;
      bottom: -180px;
      left: -180px;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(147, 197, 253, .05) 0%, transparent 55%);
      animation: blobDrift 10s ease-in-out infinite reverse
    }

    .cta-title {
      font-size: 54px;
      font-weight: 700;
      color: #1c1917;
      text-align: center;
      margin-bottom: 14px;
      line-height: 1.2;
      position: relative;
      z-index: 1;
      letter-spacing: -1px
    }

    .cta-sub {
      font-size: 18px;
      color: #a8a29e;
      text-align: center;
      max-width: 640px;
      line-height: 1.6;
      margin-bottom: 44px;
      position: relative;
      z-index: 1;
      font-weight: 400
    }

    .cta-btn {
      display: inline-block;
      padding: 16px 48px;
      background: #e11d48;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      border: 2px solid #e11d48;
      cursor: pointer;
      transition: all .25s ease;
      text-decoration: none;
      font-family: inherit;
      position: relative;
      z-index: 1;
      letter-spacing: .5px;
      box-shadow: 6px 6px 0 rgba(225, 29, 72, .25)
    }

    .cta-btn:hover {
      background: #be123c;
      border-color: #be123c;
      box-shadow: 4px 4px 0 rgba(225, 29, 72, .3);
      transform: translate(2px, 2px)
    }

    .cta-btn:active {
      transform: translate(4px, 4px);
      box-shadow: none
    }

    .cta-features {
      display: flex;
      gap: 48px;
      margin-bottom: 36px;
      position: relative;
      z-index: 1
    }

    .cta-feature {
      text-align: center
    }

    .cta-feature .num {
      font-size: 36px;
      font-weight: 700;
      color: #e11d48;
      font-family: 'SF Mono', monospace;
      letter-spacing: -2px;
      text-shadow: 3px 3px 0 #fecaca
    }

    .cta-feature .lbl {
      font-size: 13px;
      color: #d6d3d1;
      margin-top: 4px;
      font-weight: 500
    }

    /* ─── Extra Slides (iframe) ─── */
    .slide-iframe {
      padding: 0 !important;
      background: #fff
    }

    .slide-iframe iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      inset: 0
    }

    /* ─── Navigation ─── */
    .nav-bar {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fff;
      border: 2px solid #e7e5e4;
      padding: 8px 18px;
      z-index: 1000;
      box-shadow: 6px 6px 0 #e7e5e4
    }

    .nav-btn {
      width: 36px;
      height: 36px;
      border: 2px solid #e7e5e4;
      background: #fafaf9;
      color: #a8a29e;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s ease
    }

    .nav-btn:hover {
      border-color: #e11d48;
      color: #e11d48;
      background: #fef2f2
    }

    .nav-dots {
      display: flex;
      gap: 6px
    }

    /* ─── Cartoon Text ─── */
    .cartoon-text {
      position: fixed;
      z-index: 998;
      font-size: 44px;
      font-weight: 900;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', 'PingFang SC', 'Microsoft YaHei', cursive;
      cursor: default;
      user-select: none;
      line-height: 1.2;
      pointer-events: none;
      letter-spacing: 2px;
      display: inline-block;
      white-space: pre
    }

    .ct-char {
      display: inline-block;
      transform-origin: center bottom
    }

    .ct-char.anim-bounce {
      animation: bounce 1.6s ease-in-out infinite
    }

    .ct-char.anim-wiggle {
      animation: animWiggle .7s ease-in-out infinite
    }

    .ct-char.anim-spin {
      animation: animSpin 2.2s linear infinite
    }

    .ct-char.anim-pulse {
      animation: animPulse 1.3s ease-in-out infinite
    }

    .ct-char.anim-shake {
      animation: animShake .6s ease-in-out infinite
    }

    .ct-char.anim-float {
      animation: animFloat 3.2s ease-in-out infinite
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0) scale(1, 1)
      }

      20% {
        transform: translateY(-22px) scale(1.06, .94)
      }

      40% {
        transform: translateY(0) scale(.96, 1.04)
      }

      55% {
        transform: translateY(-10px) scale(1.02, .98)
      }

      70% {
        transform: translateY(0) scale(.99, 1.01)
      }
    }

    @keyframes animWiggle {

      0%,
      100% {
        transform: rotate(0deg)
      }

      25% {
        transform: rotate(-8deg)
      }

      75% {
        transform: rotate(8deg)
      }
    }

    @keyframes animSpin {
      0% {
        transform: rotate(0deg) scale(1)
      }

      50% {
        transform: rotate(180deg) scale(1.08)
      }

      100% {
        transform: rotate(360deg) scale(1)
      }
    }

    @keyframes animPulse {

      0%,
      100% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.18)
      }
    }

    @keyframes animShake {

      0%,
      100% {
        transform: translateX(0)
      }

      20% {
        transform: translateX(-8px) rotate(-3deg)
      }

      40% {
        transform: translateX(8px) rotate(3deg)
      }

      60% {
        transform: translateX(-5px) rotate(-2deg)
      }

      80% {
        transform: translateX(5px) rotate(2deg)
      }
    }

    @keyframes animFloat {

      0%,
      100% {
        transform: translateY(0) rotate(-1deg)
      }

      33% {
        transform: translateY(-14px) rotate(2deg)
      }

      66% {
        transform: translateY(-5px) rotate(-1deg)
      }
    }

    .blk-flist .flist-item:hover {
      border-color: #e11d48;
      box-shadow: 4px 4px 0 rgba(225, 29, 72, .2);
      transform: translate(-2px, -2px)
    }

    .blk-flist .flist-icon {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border: 2px solid #e7e5e4;
      background: #fef2f2
    }

    .blk-flist .flist-content h4 {
      font-size: 18px;
      font-weight: 600;
      color: #292524;
      margin-bottom: 4px
    }

    .blk-flist .flist-content p {
      font-size: 14px;
      color: #a8a29e;
      line-height: 1.6
    }

    /* Template: video */
    .blk-video {
      padding: 20px 0;
      text-align: center
    }

    .blk-video h3 {
      font-size: 28px;
      font-weight: 700;
      color: #1c1917;
      margin-bottom: 8px
    }

    .blk-video .blk-subtitle {
      font-size: 16px;
      color: #a8a29e;
      margin-bottom: 20px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto
    }

    .blk-video .video-container {
      border: 2px solid #e7e5e4;
      overflow: hidden;
      max-width: 1000px;
      margin: 0 auto;
      background: #000
    }

    .blk-video .video-container video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      object-fit: contain
    }

    /* Template: stats */
    .blk-stats {
      padding: 24px 0;
      text-align: center
    }

    .blk-stats h3 {
      font-size: 28px;
      font-weight: 700;
      color: #1c1917;
      margin-bottom: 28px
    }

    .blk-stats .stats-row {
      display: flex;
      justify-content: center;
      gap: 40px
    }

    .blk-stats .stat-item {
      padding: 24px 32px;
      background: #fff;
      border: 2px solid #e7e5e4;
      min-width: 160px;
      transition: all .3s ease;
      box-shadow: 4px 4px 0 #e7e5e4
    }

    .blk-stats .stat-item:hover {
      border-color: #e11d48;
      box-shadow: 4px 4px 0 rgba(225, 29, 72, .2);
      transform: translate(-2px, -2px)
    }

    .blk-stats .stat-value {
      font-size: 40px;
      font-weight: 700;
      color: #e11d48;
      font-family: 'SF Mono', monospace;
      letter-spacing: -2px;
      text-shadow: 3px 3px 0 #fecaca
    }

    .blk-stats .stat-label {
      font-size: 14px;
      color: #a8a29e;
      margin-top: 6px;
      font-weight: 500
    }

    /* Custom page scrollbar */
    .custom-slide::-webkit-scrollbar {
      width: 4px
    }

    .custom-slide::-webkit-scrollbar-thumb {
      background: #e11d48
    }

    /* ─── Entrance Animations ─── */
    .slide > * {
      opacity: 0;
      transform: translateY(20px)
    }

    .slide > .dot-grid,
    .slide > .blob,
    .slide > .deco {
      opacity: .04;
      animation: none !important;
      transform: none !important
    }

    .slide > .bg-pattern {
      animation: none !important;
      transform: none !important
    }

    @keyframes entSlideUp {
      from { opacity: 0; transform: translateY(20px) }
      to { opacity: 1; transform: translateY(0) }
    }
    @keyframes entFadeIn {
      from { opacity: 0 } to { opacity: 1 }
    }
    @keyframes entSlideLeft {
      from { opacity: 0; transform: translateX(36px) }
      to { opacity: 1; transform: translateX(0) }
    }
    @keyframes entSlideRight {
      from { opacity: 0; transform: translateX(-36px) }
      to { opacity: 1; transform: translateX(0) }
    }
    @keyframes entScaleIn {
      from { opacity: 0; transform: scale(.88) }
      to { opacity: 1; transform: scale(1) }
    }
    @keyframes entBlurIn {
      from { opacity: 0; filter: blur(8px) }
      to { opacity: 1; filter: blur(0) }
    }
    @keyframes entFlipIn {
      from { opacity: 0; transform: perspective(600px) rotateX(-10deg) }
      to { opacity: 1; transform: perspective(600px) rotateX(0) }
    }
    @keyframes entPopIn {
      0% { opacity: 0; transform: scale(.6) }
      60% { opacity: 1; transform: scale(1.05) }
      100% { opacity: 1; transform: scale(1) }
    }
    @keyframes entDriftUp {
      from { opacity: 0; transform: translateY(32px) translateX(-10px) }
      to { opacity: 1; transform: translateY(0) translateX(0) }
    }
    @keyframes entZoomUp {
      from { opacity: 0; transform: scale(.94) translateY(12px) }
      to { opacity: 1; transform: scale(1) translateY(0) }
    }

    .ent-fadeSlideUp { animation: entSlideUp .5s cubic-bezier(.22,1,.36,1) both }
    .ent-fadeIn { animation: entFadeIn .45s ease both }
    .ent-fadeSlideLeft { animation: entSlideLeft .5s cubic-bezier(.22,1,.36,1) both }
    .ent-fadeSlideRight { animation: entSlideRight .5s cubic-bezier(.22,1,.36,1) both }
    .ent-scaleIn { animation: entScaleIn .5s cubic-bezier(.22,1,.36,1) both }
    .ent-blurIn { animation: entBlurIn .55s ease both }
    .ent-flipIn { animation: entFlipIn .55s cubic-bezier(.22,1,.36,1) both }
    .ent-popIn { animation: entPopIn .5s cubic-bezier(.22,1,.36,1) both }
    .ent-driftUp { animation: entDriftUp .55s cubic-bezier(.22,1,.36,1) both }
    .ent-zoomUp { animation: entZoomUp .5s cubic-bezier(.22,1,.36,1) both }

    .slide.active > .no-entrance,
    .slide.active > .no-entrance > * {
      animation: none !important;
      opacity: 1;
      transform: none;
      filter: none
    }

    .ent-child-fade {
      animation: entFadeIn .4s ease both
    }

    /* ─── Background Pattern Overlay ─── */
    .bg-pattern {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden
    }
  </style>
</head>

<body>

  <div class="stage" id="stage"></div>

  <button class="settings-btn" id="settingsBtn" title="编辑内容">⚙</button>

  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel" id="settingsPanel">
      <h2>编辑内容</h2>
      <p class="hint">修改后点击「应用」即时更新幻灯片</p>
      <div id="settingsBody"></div>
      <div class="s-actions">
        <button class="s-btn"
          style="background:transparent;color:#d6d3d1;font-size:12px;margin-right:auto;border:2px solid #f5f5f4;font-weight:500"
          id="settingsReset">恢复默认</button>
        <button class="s-btn s-btn-cancel" id="settingsCancel">取消</button>
        <button class="s-btn s-btn-primary" id="settingsApply">应用</button>
      </div>
    </div>
  </div>

  <div class="nav-bar" id="navBar">
    <button class="nav-btn" id="prevBtn">◀</button>
    <div class="nav-dots" id="navDots"></div>
    <span class="nav-counter" id="navCounter">1 / 7</span>
    <button class="nav-btn" id="nextBtn">▶</button>
  </div>

  <div class="cartoon-text" id="cartoonText">加油！</div>

  <div class="card-modal-overlay" id="cardModal">
    <div class="card-modal" id="cardModalBody">
      <button class="card-modal-close" id="cardModalClose">✕</button>
      <div id="cardModalContent"></div>
    </div>
  </div>

  <script>
    let DATA = {}

    const STORAGE_KEY = 'what-can-xxx-do-data-v2'

    function loadSavedData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY)
        if (raw) {
          const saved = JSON.parse(raw)
          deepMerge(DATA, saved)
        }
      } catch (_) { }
    }

    function deepMerge(target, source) {
      Object.keys(source).forEach(k => {
        if (Array.isArray(source[k])) {
          target[k] = source[k]
        } else if (typeof source[k] === 'object' && source[k] !== null && typeof target[k] === 'object') {
          deepMerge(target[k], source[k])
        } else {
          target[k] = source[k]
        }
      })
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA))
    }

    fetch('data.json')
      .then(r => r.json())
      .then(json => {
        DATA = json
        loadSavedData()
        migrateOldStorage()
        loadPlugins().then(() => init())
      })
      .catch(() => {
        init()
      })

    function migrateOldStorage() {
      try {
        const oldRaw = localStorage.getItem('what-can-xxx-do-data')
        if (oldRaw) {
          const old = JSON.parse(oldRaw)
          if (old.features && Array.isArray(old.features) && !localStorage.getItem(STORAGE_KEY)) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
              cover: old.cover || DATA.cover,
              features: { title: DATA.features?.title, desc: DATA.features?.desc, items: old.features },
              practices: { title: DATA.practices?.title, desc: DATA.practices?.desc, items: old.practices },
              impressions: { title: DATA.impressions?.title, desc: DATA.impressions?.desc, items: old.impressions },
              scores: { title: DATA.scores?.title, desc: DATA.scores?.desc, items: old.scores },
              usecases: DATA.usecases,
              cta: DATA.cta,
            }))
          }
        }
      } catch (_) { }
    }

    /* ─── Animation Plugin System ─── */
    let _activePluginInstances = []

    function loadPluginScript(src) {
      return new Promise((resolve, reject) => {
        const existing = document.querySelector(`script[data-plugin-src="${src}"]`)
        if (existing) return resolve()
        const s = document.createElement('script')
        s.src = src
        s.dataset.pluginSrc = src
        s.onload = resolve
        s.onerror = reject
        document.head.appendChild(s)
      })
    }

    function loadPluginCSS(href) {
      if (!href) return Promise.resolve()
      const existing = document.querySelector(`link[data-plugin-href="${href}"]`)
      if (existing) return Promise.resolve()
      const l = document.createElement('link')
      l.rel = 'stylesheet'
      l.href = href
      l.dataset.pluginHref = href
      document.head.appendChild(l)
      return Promise.resolve()
    }

    function loadPlugins() {
      const anims = DATA.animations || []
      const tasks = anims.filter(a => a.enabled).map(a => {
        const jobs = []
        if (a.css) jobs.push(loadPluginCSS(a.css).catch(() => console.warn('CSS 插件加载失败:', a.css)))
        if (a.js) jobs.push(loadPluginScript(a.js).catch(() => console.warn('JS 插件加载失败:', a.js)))
        return Promise.all(jobs)
      })
      return Promise.all(tasks).then(() => initPlugins()).catch(() => initPlugins())
    }

    function initPlugins() {
      destroyPlugins()
      const anims = DATA.animations || []
      anims.filter(a => a.enabled).forEach(a => {
        const plugin = window.AnimationPlugins && window.AnimationPlugins.get(a.name)
        if (plugin) {
          plugin.init(a.config || {})
          _activePluginInstances.push(plugin)
        }
      })
    }

    function destroyPlugins() {
      _activePluginInstances.forEach(p => {
        if (p.uninstall) p.uninstall()
        if (p.destroy) p.destroy()
      })
      _activePluginInstances = []
    }

    /* ─── End Animation Plugin System ─── */

    function renderSlides() {
      const { cover, features, practices, impressions, scores, usecases, cta } = DATA

      const avg = scores.items.length
        ? (scores.items.reduce((s, x) => s + x.value, 0) / scores.items.length).toFixed(1)
        : '0.0'

      function sc(section, cls) {
        let s = ''
        if (section.bg) s += `background:${esc(section.bg)};`
        if (section.fg) s += `color:${esc(section.fg)};`
        return s ? `style="${s}"` : `class="${cls}"`
      }

      const slideMap = {
        cover: `<div class="slide cover active" ${sc(cover, 'bg-white')}>
      ${renderBgPattern(cover.bgPattern)}
      <div class="deco deco-1"></div>
      <div class="deco deco-2"></div>
      <div class="dot-grid"></div>
      <h1><span class="product-name">${esc(cover.product)}</span> ${esc(cover.questionSuffix || '可以做什么？')}</h1>
      <div class="divider"></div>
      <p class="cover-sub">${esc(cover.subtitle)}</p>
      <p style="margin-top:28px;font-size:15px;color:#d6d3d1;letter-spacing:4px">——— ${esc(cover.tagline)} ———</p>
      <div class="cover-badges" style="margin-top:36px">${cover.badges.map(b => `<span class="cover-badge">${esc(b)}</span>`).join('')
          }</div>
    </div>`,
        features: `<div class="slide" ${sc(features, 'bg-rose')}>
      ${renderBgPattern(features.bgPattern)}
      <div class="deco deco-3"></div>
      <div class="page-tag">${esc(features.tag || '特点')}</div>
      <h2 class="pg-title"><span class="accent"> ${esc(features.title)}</span></h2>
      <p class="pg-desc">${esc(features.desc)}</p>
      <div class="feat-wrap">${features.items.map((f, i) => `
          <div class="feat-card">
            <div class="feat-num">${i + 1}</div>
            <div>
              <h3>${esc(f.title)}</h3>
              <p>${esc(f.desc)}</p>
              ${renderAttach(f.code)}
            </div>
          </div>
        `).join('')
          }</div>
    </div>`,
        practices: `<div class="slide" ${sc(practices, 'bg-white')}>
      ${renderBgPattern(practices.bgPattern)}
      <div class="deco deco-4"></div>
      <div class="page-tag">${esc(practices.tag || '测试实践')}</div>
      <h2 class="pg-title">${esc(practices.title)}</h2>
      <p class="pg-desc">${esc(practices.desc)}</p>
      <div class="prac-grid">${practices.items.map(p => `
          <div class="prac-card">
            <span class="label">${esc(p.label)}</span>
            <h3>${esc(p.title)}</h3>
            <p>${esc(p.desc)}</p>
            ${renderAttach(p.code)}
          </div>
        `).join('')
          }</div>
    </div>`,
        impressions: `<div class="slide" ${sc(impressions, 'bg-pink')}>
      ${renderBgPattern(impressions.bgPattern)}
      <div class="deco deco-5"></div>
      <div class="deco deco-6"></div>
      <div class="page-tag">${esc(impressions.tag || '使用感想')}</div>
      <h2 class="pg-title">${esc(impressions.title)}</h2>
      <p class="pg-desc">${esc(impressions.desc)}</p>
      <div class="impr-wrap">${impressions.items.map(im => `
          <div class="impr-card">
            <div class="impr-quote">${esc(im.quote)}</div>
            <div class="impr-author">—— <strong>${esc(im.author)}</strong></div>
            ${renderAttach(im.code)}
          </div>
        `).join('')
          }</div>
    </div>`,
        scores: `<div class="slide" ${sc(scores, 'bg-coral')}>
      ${renderBgPattern(scores.bgPattern)}
      <div class="deco deco-7"></div>
      <div class="page-tag">${esc(scores.tag || '综合评分')}</div>
      <h2 class="pg-title">为 ${esc(cover.product)} <span class="accent">${esc(scores.title)}</span></h2>
      <p class="pg-desc">${esc(scores.desc)}</p>
      <div class="score-wrap">${scores.items.map(s => `
          <div class="score-row">
            <span class="score-label">${esc(s.label)}</span>
            <div class="score-bar-bg"><div class="score-bar-fill" style="width:${Math.max(0, Math.min(100, s.value))}%"></div></div>
            <span class="score-val">${s.value}</span>
          </div>
        `).join('')
          }</div>
      <div class="score-total">
        <div class="big">${avg}</div>
        <div class="lbl">综合评分（满分 100）</div>
      </div>
    </div>`,
        usecases: `<div class="slide" ${sc(usecases, 'bg-white')}>
      ${renderBgPattern(usecases.bgPattern)}
      <div class="page-tag">${esc(usecases.tag || '场景')}</div>
      <h2 class="pg-title">${esc(usecases.title)}</h2>
      <p class="pg-desc">${esc(usecases.desc)}</p>
      <div class="usecase-wrap">${usecases.items.map(u => `
          <div class="usecase-card">
            <div class="usecase-icon">${esc(u.icon)}</div>
            <h3>${esc(u.title)}</h3>
            <p>${esc(u.desc)}</p>
            ${renderAttach(u.code)}
            <span class="usecase-tag">${esc(u.tag)}</span>
          </div>
        `).join('')
          }</div>
    </div>`,
        cta: `<div class="slide cta" ${sc(cta, 'bg-warm')}>
      ${renderBgPattern(cta.bgPattern)}
      <div class="deco deco-1"></div>
      <div class="deco deco-2"></div>
      <div class="dot-grid"></div>
      <div class="cta-features">${cta.features.map(f => `
          <div class="cta-feature">
            <div class="num">${esc(f.num)}</div>
            <div class="lbl">${esc(f.lbl)}</div>
          </div>
        `).join('')
          }</div>
      <div class="cta-title">${esc(cta.title)}</div>
      <p class="cta-sub">${esc(cta.subtitle)}</p>
      <button class="cta-btn">${esc(cta.btnText)}</button>
    </div>`,
      }

      /* Register custom pages into slideMap */
      const customPages = DATA.customPages || []
      customPages.forEach(cp => {
        if (cp.id) slideMap['custom:' + cp.id] = renderCustomPage(cp)
      })

      const extraSlides = DATA.extraSlides || []
      extraSlides.forEach((es, i) => {
        slideMap['extra:' + i] = `<div class="slide slide-iframe">
      <iframe src="${esc(es.src)}" loading="lazy" allowfullscreen></iframe>
    </div>`
      })

      /* Build custom page title → id lookup */
      const customTitleToId = {}
      customPages.forEach(cp => { if (cp.id) customTitleToId[cp.id] = 'custom:' + cp.id })

      // Build title → extra:N lookup
      const titleToExtra = {}
      extraSlides.forEach((es, i) => { if (es.title) titleToExtra[es.title] = 'extra:' + i })

      // Resolve a slideOrder entry to a slideMap key
      function resolveId(id) {
        if (slideMap[id]) return id
        if (customTitleToId[id]) return customTitleToId[id]
        if (titleToExtra[id]) return titleToExtra[id]
        return null
      }

      // Build order from slideOrder, appending any extra/custom slides not yet listed
      const defaultOrder = ['cover', 'features', 'practices', 'impressions', 'scores', 'usecases', 'cta']
      let order = DATA.slideOrder && DATA.slideOrder.length ? [...DATA.slideOrder] : [...defaultOrder]
      customPages.forEach(cp => {
        const id = cp.id ? 'custom:' + cp.id : null
        if (id && !order.some(o => resolveId(o) === id)) order.push(cp.id)
      })
      extraSlides.forEach(es => {
        const id = resolveId(es.title) || ('extra:' + extraSlides.indexOf(es))
        if (!order.some(o => resolveId(o) === id)) order.push(es.title || ('extra:' + extraSlides.indexOf(es)))
      })

      return order.map(id => slideMap[resolveId(id)]).filter(Boolean)
    }

    function esc(s) {
      const d = document.createElement('div')
      d.textContent = s
      return d.innerHTML
    }

    /* ─── Background Pattern Renderer ─── */
    const BG_PATTERN_TYPES = [
      { value: 'stripe-h', label: '水平条纹' },
      { value: 'stripe-v', label: '垂直条纹' },
      { value: 'stripe-d1', label: '斜纹 /' },
      { value: 'stripe-d2', label: '斜纹 \\' },
      { value: 'dots', label: '圆点' },
      { value: 'grid', label: '网格' },
      { value: 'cross', label: '十字' },
      { value: 'checkerboard', label: '棋盘格' },
      { value: 'zigzag', label: '锯齿' },
      { value: 'triangle', label: '三角形' },
      { value: 'waves', label: '波浪' },
      { value: 'herringbone', label: '鱼骨纹' },
      { value: 'diagonal-lines', label: '密集斜线' },
      { value: 'plus', label: '加号' }
    ]

    function renderBgPatternSettings(prefix, sectionData) {
      const p = sectionData.bgPattern || { type: 'stripe-h', color: '#000000', opacity: 0.05, size: 20, thickness: 1 }
      return `<div style="margin-top:6px;padding:10px 12px;background:#fafaf9;border:2px solid #f5f5f4;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:8px;align-items:end">
        <div class="s-field" style="margin-bottom:0"><label>纹理类型</label><select data-path="${prefix}.bgPattern.type" style="width:100%;padding:5px 8px;border:2px solid #e7e5e4;font-size:12px;font-family:inherit;background:#fff;color:#292524;outline:none">${BG_PATTERN_TYPES.map(o => `<option value="${o.value}"${(p.type || 'stripe-h') === o.value ? ' selected' : ''}>${o.label}</option>`).join('')}</select></div>
        <div class="s-field" style="margin-bottom:0"><label>纹理颜色</label><input type="color" data-path="${prefix}.bgPattern.color" value="${p.color || '#000000'}" style="width:100%;height:32px;padding:2px;border:2px solid #e7e5e4;cursor:pointer"></div>
        <div class="s-field" style="margin-bottom:0"><label>明显度</label><div style="display:flex;gap:4px;align-items:center"><input type="range" min="0" max="1" step="0.01" value="${p.opacity != null ? p.opacity : 0.1}" data-path="${prefix}.bgPattern.opacity" oninput="this.nextElementSibling.textContent=this.value" style="flex:1"><span style="font-size:11px;font-weight:700;color:#e11d48;min-width:32px;text-align:center">${p.opacity != null ? p.opacity : 0.1}</span></div></div>
        <div class="s-field" style="margin-bottom:0"><label>尺寸</label><div style="display:flex;gap:4px;align-items:center"><input type="range" min="4" max="80" step="1" value="${p.size || 20}" data-path="${prefix}.bgPattern.size" oninput="this.nextElementSibling.textContent=this.value" style="flex:1"><span style="font-size:11px;font-weight:700;color:#e11d48;min-width:24px;text-align:center">${p.size || 20}</span></div></div>
        <div class="s-field" style="margin-bottom:0"><label>粗细</label><div style="display:flex;gap:4px;align-items:center"><input type="range" min="1" max="8" step="1" value="${p.thickness || 1}" data-path="${prefix}.bgPattern.thickness" oninput="this.nextElementSibling.textContent=this.value" style="flex:1"><span style="font-size:11px;font-weight:700;color:#e11d48;min-width:24px;text-align:center">${p.thickness || 1}</span></div></div>
      </div>`
    }

    /* ─── SVG Pattern Generator Functions ─── */
    const BG_PATTERNS = {
      'stripe-h': (c, s, t) => `<svg xmlns='http://www.w3.org/2000/svg' width='${s}' height='${s}'><rect width='${s}' height='${t}' fill='${c}'/></svg>`,
      'stripe-v': (c, s, t) => `<svg xmlns='http://www.w3.org/2000/svg' width='${s}' height='${s}'><rect width='${t}' height='${s}' fill='${c}'/></svg>`,
      'stripe-d1': (c, s, t) => `<svg xmlns='http://www.w3.org/2000/svg' width='${s}' height='${s}'><line x1='0' y1='${s}' x2='${s}' y2='0' stroke='${c}' stroke-width='${t}'/></svg>`,
      'stripe-d2': (c, s, t) => `<svg xmlns='http://www.w3.org/2000/svg' width='${s}' height='${s}'><line x1='0' y1='0' x2='${s}' y2='${s}' stroke='${c}' stroke-width='${t}'/></svg>`,
      'dots': (c, s, t) => {
        const r = Math.max(1, Math.round(t * 1.5))
        return `<svg xmlns='http://www.w3.org/2000/svg' width='${s}' height='${s}'><circle cx='${Math.round(s / 2)}' cy='${Math.round(s / 2)}' r='${r}' fill='${c}'/></svg>`
      },
      'grid': (c, s, t) => `<svg xmlns='http://www.w3.org/2000/svg' width='${s}' height='${s}'><line x1='${s}' y1='0' x2='${s}' y2='${s}' stroke='${c}' stroke-width='${t}'/><line x1='0' y1='${s}' x2='${s}' y2='${s}' stroke='${c}' stroke-width='${t}'/></svg>`,
      'cross': (c, s, t) => {
        const m = Math.round(s / 2)
        const h = Math.round(s / 4)
        return `<svg xmlns='http://www.w3.org/2000/svg' width='${s}' height='${s}'><rect x='${m - Math.round(t / 2)}' y='${h}' width='${t}' height='${h * 2}' fill='${c}'/><rect x='${h}' y='${m - Math.round(t / 2)}' width='${h * 2}' height='${t}' fill='${c}'/></svg>`
      },
      'checkerboard': (c, s, t) => {
        const h = Math.round(s / 2)
        return `<svg xmlns='http://www.w3.org/2000/svg' width='${s}' height='${s}'><rect width='${h}' height='${h}' fill='${c}'/><rect x='${h}' y='${h}' width='${h}' height='${h}' fill='${c}'/></svg>`
      },
      'zigzag': (c, s, t) => {
        return `<svg xmlns='http://www.w3.org/2000/svg' width='${s}' height='${s}'><polyline points='0,${s} ${Math.round(s / 2)},0 ${s},${s}' fill='none' stroke='${c}' stroke-width='${t}'/></svg>`
      },
      'triangle': (c, s, t) => {
        const h = Math.round(s * 0.866)
        return `<svg xmlns='http://www.w3.org/2000/svg' width='${s}' height='${s}'><polygon points='${Math.round(s / 2)},2 ${s - 2},${h - 2} 2,${h - 2}' fill='none' stroke='${c}' stroke-width='${t}'/></svg>`
      },
      'waves': (c, s, t) => {
        const q = Math.round(s / 4)
        const m = Math.round(s / 2)
        return `<svg xmlns='http://www.w3.org/2000/svg' width='${s}' height='${s}'><path d='M0,${m} Q${q},0 ${m},${m} Q${s - q},${s} ${s},${m}' fill='none' stroke='${c}' stroke-width='${t}'/></svg>`
      },
      'herringbone': (c, s, t) => {
        const m = Math.round(s / 2)
        return `<svg xmlns='http://www.w3.org/2000/svg' width='${s}' height='${s}'><line x1='0' y1='0' x2='${m}' y2='${m}' stroke='${c}' stroke-width='${t}'/><line x1='${m}' y1='0' x2='${s}' y2='${m}' stroke='${c}' stroke-width='${t}'/><line x1='${m}' y1='${m}' x2='${s}' y2='${s}' stroke='${c}' stroke-width='${t}'/><line x1='0' y1='${m}' x2='${m}' y2='${s}' stroke='${c}' stroke-width='${t}'/></svg>`
      },
      'diagonal-lines': (c, s, t) => {
        const s2 = s * 2
        return `<svg xmlns='http://www.w3.org/2000/svg' width='${s2}' height='${s2}'><line x1='0' y1='${s}' x2='${s}' y2='0' stroke='${c}' stroke-width='${t}'/><line x1='${s}' y1='${s2}' x2='${s2}' y2='${s}' stroke='${c}' stroke-width='${t}'/><line x1='${-s}' y1='${s}' x2='0' y2='0' stroke='${c}' stroke-width='${t}'/><line x1='${s2}' y1='${s2}' x2='${s2 + s}' y2='${s}' stroke='${c}' stroke-width='${t}'/></svg>`
      },
      'plus': (c, s, t) => {
        const m = Math.round(s / 2)
        const arm = Math.max(2, Math.round(s * 0.25))
        return `<svg xmlns='http://www.w3.org/2000/svg' width='${s}' height='${s}'><rect x='${m - Math.round(t / 2)}' y='${arm}' width='${t}' height='${s - arm * 2}' fill='${c}'/><rect x='${arm}' y='${m - Math.round(t / 2)}' width='${s - arm * 2}' height='${t}' fill='${c}'/></svg>`
      }
    }

    function renderBgPattern(pattern) {
      if (!pattern || !pattern.type || !BG_PATTERNS[pattern.type]) return ''
      const sz = Math.max(4, Math.round(pattern.size || 20))
      const th = Math.max(1, Math.round(pattern.thickness || 1))
      const color = pattern.color || '#000000'
      const opacity = Math.max(0, Math.min(1, pattern.opacity != null ? pattern.opacity : 0.05))
      const svgFn = BG_PATTERNS[pattern.type]
      const svg = svgFn(color, sz, th)
      const encoded = 'data:image/svg+xml,' + encodeURIComponent(svg).replace(/'/g, '%27')
      return `<div class="bg-pattern" style="background-image:url('${encoded}');background-repeat:repeat;opacity:${opacity}"></div>`
    }
    /* ─── End Background Pattern Renderer ─── */
    function isImagePath(s) {
      return /\.(png|jpg|jpeg|gif|webp|svg|bmp)(\?.*)?$/i.test(s)
    }
    function isVideoPath(s) {
      return /\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(s)
    }
    function renderAttach(code) {
      if (!code) return ''
      if (isImagePath(code)) return `<div class="card-attach card-attach-img"><img src="${esc(code)}"></div>`
      if (isVideoPath(code)) return `<div class="card-attach card-attach-video"><video src="${esc(code)}" controls playsinline></video></div>`
      return `<div class="card-attach card-attach-code">${esc(code)}</div>`
    }
    /* ─── Custom Page Block Rendering ─── */
    function blockFrame(blk) {
      const s = blk.style || 'solid'
      return 'blk-frame-' + s
    }

    function renderBlock(blk) {
      const t = blk.template || 'hero-text'
      const fc = blockFrame(blk)
      switch (t) {
        case 'hero-text': return `
          <div class="cp-block blk-hero ${fc}">
            ${blk.title ? `<h2>${esc(blk.title)}</h2>` : ''}
            ${blk.subtitle ? `<div class="blk-subtitle">${esc(blk.subtitle)}</div>` : ''}
            ${blk.media ? renderAttach(blk.media) : ''}
          </div>`
        case 'two-col': return `
          <div class="cp-block blk-twocol ${fc}${blk.reverse ? ' reverse' : ''}">
            <div class="blk-text">
              ${blk.title ? `<h3>${esc(blk.title)}</h3>` : ''}
              ${blk.text ? `<p>${esc(blk.text)}</p>` : ''}
            </div>
            ${blk.media ? `<div class="blk-media-wrap">${renderAttachRaw(blk.media)}</div>` : ''}
          </div>`
        case 'gallery': {
          const items = blk.items || []
          return `
          <div class="cp-block blk-gallery ${fc}">
            ${blk.title ? `<h3>${esc(blk.title)}</h3>` : ''}
            <div class="gallery-grid">${items.map(it => `
              <div class="gallery-item">
                ${it.media ? renderAttachRaw(it.media) : ''}
                ${it.caption ? `<div class="gallery-caption">${esc(it.caption)}</div>` : ''}
              </div>`).join('')}
            </div>
          </div>`
        }
        case 'quote': return `
          <div class="cp-block blk-quote ${fc}">
            ${blk.text ? `<div class="quote-text">${esc(blk.text)}</div>` : ''}
            ${blk.author ? `<div class="quote-author">—— <strong>${esc(blk.author)}</strong></div>` : ''}
          </div>`
        case 'feature-list': {
          const items = blk.items || []
          return `
          <div class="cp-block blk-flist ${fc}">
            ${blk.title ? `<h3>${esc(blk.title)}</h3>` : ''}
            <div class="flist-grid">${items.map(it => `
              <div class="flist-item">
                <div class="flist-icon">${esc(it.icon || '✦')}</div>
                <div class="flist-content">
                  <h4>${esc(it.title || '')}</h4>
                  <p>${esc(it.desc || '')}</p>
                </div>
              </div>`).join('')}
            </div>
          </div>`
        }
        case 'video': return `
          <div class="cp-block blk-video ${fc}">
            ${blk.title ? `<h3>${esc(blk.title)}</h3>` : ''}
            ${blk.text ? `<div class="blk-subtitle">${esc(blk.text)}</div>` : ''}
            ${blk.media ? `<div class="video-container">${renderAttachRaw(blk.media)}</div>` : ''}
          </div>`
        case 'stats': {
          const items = blk.items || []
          return `
          <div class="cp-block blk-stats ${fc}">
            ${blk.title ? `<h3>${esc(blk.title)}</h3>` : ''}
            <div class="stats-row">${items.map(it => `
              <div class="stat-item">
                <div class="stat-value">${esc(it.value || '')}</div>
                <div class="stat-label">${esc(it.label || '')}</div>
              </div>`).join('')}
            </div>
          </div>`
        }
        default: return `<div class="cp-block ${fc}"><p style="color:#d6d3d1;text-align:center">未知模板: ${esc(t)}</p></div>`
      }
    }

    function renderAttachRaw(src) {
      if (!src) return ''
      if (isImagePath(src)) return `<img src="${esc(src)}">`
      if (isVideoPath(src)) return `<video src="${esc(src)}" controls playsinline></video>`
      return `<div class="card-attach-code">${esc(src)}</div>`
    }

    function renderCustomPage(page) {
      const blocks = (page.blocks || []).map(b => renderBlock(b)).join('')
      let sc = ''
      if (page.bg) sc += `background:${esc(page.bg)};`
      if (page.fg) sc += `color:${esc(page.fg)};`
      const attr = sc ? `style="${sc}"` : 'class="bg-white"'
      return `<div class="slide custom-slide" ${attr}>
      ${renderBgPattern(page.bgPattern)}
      <div class="cp-header">
        ${page.tag ? `<div class="page-tag">${esc(page.tag)}</div>` : ''}
        ${page.title ? `<h2 class="pg-title">${esc(page.title)}</h2>` : ''}
        ${page.desc ? `<p class="pg-desc">${esc(page.desc)}</p>` : ''}
      </div>
      ${blocks}
    </div>`

    function getCartoonText() {
      if (!DATA.cartoonText) DATA.cartoonText = { text: '加油！', color: '#e11d48', position: 'bottom-left', anims: ['bounce', 'wiggle', 'pulse'] }
      if (!DATA.cartoonText.anims) DATA.cartoonText.anims = []
      if (!DATA.cartoonText.color) DATA.cartoonText.color = '#e11d48'
      if (!DATA.cartoonText.position) DATA.cartoonText.position = 'bottom-left'
      while (DATA.cartoonText.anims.length < DATA.cartoonText.text.length) DATA.cartoonText.anims.push('bounce')
      while (DATA.cartoonText.anims.length > DATA.cartoonText.text.length) DATA.cartoonText.anims.pop()
      return DATA.cartoonText
    }
    function updateCartoonText() {
      const el = document.getElementById('cartoonText')
      if (!el) return
      const cfg = getCartoonText()
      const text = cfg.text || ''
      const anims = cfg.anims || []
      const color = cfg.color || '#e11d48'
      const position = cfg.position || 'bottom-left'

      el.style.color = color
      el.style.textShadow = `3px 3px 0 ${color}33, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff`

      const positions = {
        'bottom-left': { bottom: '100px', left: '24px', top: 'auto', right: 'auto' },
        'bottom-right': { bottom: '100px', right: '24px', top: 'auto', left: 'auto' },
        'top-left': { top: '100px', left: '24px', bottom: 'auto', right: 'auto' },
        'top-right': { top: '100px', right: '24px', bottom: 'auto', left: 'auto' },
      }
      const pos = positions[position] || positions['bottom-left']
      Object.assign(el.style, pos)

      el.innerHTML = ''
      for (let i = 0; i < text.length; i++) {
        const ch = text[i]
        const span = document.createElement('span')
        span.textContent = ch === ' ' ? '\u00A0' : ch
        const anim = anims[i] || 'bounce'
        span.className = 'ct-char anim-' + anim
        el.appendChild(span)
      }
    }
    function renderCartoonCharAnims() {
      const container = document.getElementById('ct-char-anims')
      if (!container) return
      const input = document.getElementById('ct-text-input')
      if (!input) return
      const text = input.value
      const cfg = getCartoonText()
      while (cfg.anims.length < text.length) cfg.anims.push('bounce')
      while (cfg.anims.length > text.length) cfg.anims.pop()
      container.innerHTML = ''
      for (let i = 0; i < text.length; i++) {
        const ch = text[i]
        const anim = cfg.anims[i] || 'bounce'
        const box = document.createElement('div')
        box.style.cssText = 'text-align:center;border:2px solid #e7e5e4;padding:6px 8px;background:#fff;min-width:56px'
        box.innerHTML =
          '<div style="font-size:22px;font-weight:900;margin-bottom:2px;line-height:1.2">' + esc(ch) + '</div>' +
          '<select class="ct-anim-sel" style="width:100%;padding:3px;border:2px solid #e7e5e4;font-size:11px;font-family:inherit;background:#fff;color:#292524;outline:none">' +
          '<option value="bounce"' + (anim === 'bounce' ? ' selected' : '') + '>弹跳</option>' +
          '<option value="wiggle"' + (anim === 'wiggle' ? ' selected' : '') + '>摆动</option>' +
          '<option value="spin"' + (anim === 'spin' ? ' selected' : '') + '>旋转</option>' +
          '<option value="pulse"' + (anim === 'pulse' ? ' selected' : '') + '>脉动</option>' +
          '<option value="shake"' + (anim === 'shake' ? ' selected' : '') + '>抖动</option>' +
          '<option value="float"' + (anim === 'float' ? ' selected' : '') + '>漂浮</option>' +
          '</select>'
        container.appendChild(box)
      }
    }

    function applyPreset(idx) {
      const p = PRESETS[idx]

      const allColors = [...p.bgs, ...p.fgs]
      allColors.forEach((c, i) => {
        const parts = PRESET_KEYS[i].split('.')
        let obj = DATA
        for (let j = 0; j < parts.length - 1; j++) obj = obj[parts[j]]
        obj[parts[parts.length - 1]] = c
        const input = document.querySelector(`#settingsBody [data-path="${PRESET_KEYS[i]}"]`)
        if (input) {
          const isFg = parts[parts.length - 1] === 'fg'
          input.value = c || (isFg ? '#1c1917' : '#ffffff')

    /* ─── Entrance Animation System ─── */
    const ENTRANCE_TYPES = ['fadeSlideUp', 'fadeIn', 'fadeSlideLeft', 'fadeSlideRight', 'scaleIn', 'blurIn', 'flipIn', 'popIn', 'driftUp', 'zoomUp']
    const WRAPPER_SEL = '.feat-wrap, .prac-grid, .usecase-wrap, .impr-wrap, .score-wrap, .cover-badges, .cta-features'
    const CARD_SEL = '.feat-card, .prac-card, .usecase-card, .impr-card, .score-row, .cover-badge, .cta-feature'

    function clearEntClasses(el) {
      el.classList.remove('no-entrance', 'ent-child-fade')
      ENTRANCE_TYPES.forEach(t => el.classList.remove('ent-' + t))
      el.style.animationDelay = ''
    }

    function applyEntrance(slideEl, entranceCfg) {
      if (!slideEl || !entranceCfg) return
      const baseDelay = entranceCfg.delay || 150
      const staggerStep = entranceCfg.stagger ? 70 : 0
      const entranceType = entranceCfg.type || 'fadeSlideUp'
      let d = 0

      // Batch all DOM changes — no forced reflow between clear and set
      slideEl.querySelectorAll('.slide > *').forEach(el => {
        if (el.classList.contains('dot-grid') || el.classList.contains('blob') || el.classList.contains('deco') || el.classList.contains('bg-pattern')) return
        clearEntClasses(el)
        const cards = el.querySelectorAll(CARD_SEL)
        const isWrapper = cards.length >= 2

        if (isWrapper) {
          el.style.animationDelay = d + 'ms'
          d += 50
          cards.forEach((card, i) => {
            clearEntClasses(card)
            card.style.animationDelay = (d + i * staggerStep) + 'ms'
          })
          d += cards.length * staggerStep + 80
        } else {
          el.style.animationDelay = d + 'ms'
          d += staggerStep || 80
        }
      })

      // Now add animation classes in a second pass — delays are already set
      slideEl.querySelectorAll('.slide > *').forEach(el => {
        if (el.classList.contains('dot-grid') || el.classList.contains('blob') || el.classList.contains('deco') || el.classList.contains('bg-pattern')) return
        const cards = el.querySelectorAll(CARD_SEL)
        const isWrapper = cards.length >= 2

        if (isWrapper) {
          el.classList.add('ent-fadeIn')
          cards.forEach(card => card.classList.add('ent-' + entranceType))
        } else {
          el.classList.add('ent-' + entranceType)
        }
      })
    }

    function resetEntrance(slideEl) {
      if (!slideEl) return
      slideEl.querySelectorAll('.slide > *').forEach(el => {
        if (el.classList.contains('bg-pattern')) return
        clearEntClasses(el)
        el.querySelectorAll(CARD_SEL).forEach(card => clearEntClasses(card))
      })
    }

    function applyScoreBarAnimations(slideEl) {
      if (!slideEl) return
      const bars = slideEl.querySelectorAll('.score-bar-fill')
      bars.forEach((bar, i) => {
        bar.style.transition = 'none'
        bar.style.width = '0'
        void bar.offsetWidth
        bar.style.transition = `width 1s cubic-bezier(.22,1,.36,1) ${250 + i * 100}ms`
        bar.style.width = bar.dataset.targetWidth || bar.style.width
      })
    }

    function resetScoreBarAnimations() {
      document.querySelectorAll('.score-bar-fill').forEach(bar => {
        bar.style.transition = 'none'
        bar.style.width = '0'
      })
    }

    function rebuild() {
      if (window._rebuild) window._rebuild()
    }

    function init() {
      let current = 0

      function rebuild() {
        const s = renderSlides()
        stage.innerHTML = s.join('')
        const total = s.length

        navDots.innerHTML = Array.from({ length: total }, (_, i) =>
          `<button class="nav-dot${i === 0 ? ' active' : ''}" data-index="${i}"></button>`
        ).join('')

        if (current >= total) current = total - 1
        document.querySelectorAll('.slide').forEach((el, i) => {
          el.classList.toggle('active', i === current)
        })
        document.querySelectorAll('.nav-dot').forEach((el, i) => {
          el.classList.toggle('active', i === current)
        })
        counter.textContent = `${current + 1} / ${total}`
        window._totalSlides = total
        updateCartoonText()
        initPlugins()

        // Apply entrance animations to current slide
        resetScoreBarAnimations()
        document.querySelectorAll('.slide').forEach(s => resetEntrance(s))
        const activeSlide = document.querySelector('.slide.active')
        if (activeSlide) {
          const sections = ['cover', 'features', 'practices', 'impressions', 'scores', 'usecases', 'cta']
          const idx = Array.from(document.querySelectorAll('.slide')).indexOf(activeSlide)
          const order = DATA.slideOrder && DATA.slideOrder.length ? DATA.slideOrder : sections
          const sectionKey = order[current]
          const sectionData = sectionKey && DATA[sectionKey]
          if (sectionData && sectionData.entrance) {
            applyEntrance(activeSlide, sectionData.entrance)
          } else {
            applyEntrance(activeSlide, { type: 'fadeSlideUp', delay: 200 })
          }
          if (sectionKey === 'scores') {
            activeSlide.querySelectorAll('.score-bar-fill').forEach(bar => {
              bar.dataset.targetWidth = bar.style.width
            })
            applyScoreBarAnimations(activeSlide)
          }
        }
      }

      window._pageGoTo = goTo
      rebuild()

      function goTo(index) {
        const total = window._totalSlides || document.querySelectorAll('.slide').length
        if (index < 0 || index >= total) return

        if (window._pluginGoTo) {
          window._pluginGoTo(index)
          document.querySelectorAll('.nav-dot').forEach((el, i) => el.classList.toggle('active', i === index))
          current = index
          counter.textContent = `${current + 1} / ${total}`
          return
        }

        // Reset entrance animations on previous slide
        const prevSlide = document.querySelectorAll('.slide')[current]
        if (prevSlide) resetEntrance(prevSlide)
        resetScoreBarAnimations()

        document.querySelectorAll('.slide').forEach((el, i) => {
          el.classList.toggle('active', i === index)
        })
        document.querySelectorAll('.nav-dot').forEach((el, i) => {
          el.classList.toggle('active', i === index)
        })
        current = index
        counter.textContent = `${current + 1} / ${total}`

        // Apply entrance animations to new slide
        const newSlide = document.querySelectorAll('.slide')[index]
        if (newSlide) {
          const sections = ['cover', 'features', 'practices', 'impressions', 'scores', 'usecases', 'cta']
          const order = DATA.slideOrder && DATA.slideOrder.length ? DATA.slideOrder : sections
          const sectionKey = order[index]
          const sectionData = sectionKey && DATA[sectionKey]
          if (sectionData && sectionData.entrance) {
            applyEntrance(newSlide, sectionData.entrance)
          } else {
            applyEntrance(newSlide, { type: 'fadeSlideUp', delay: 200 })
          }
          if (sectionKey === 'scores') {
            newSlide.querySelectorAll('.score-bar-fill').forEach(bar => {
              bar.dataset.targetWidth = bar.style.width
            })
            applyScoreBarAnimations(newSlide)
          }
        }
      }

      document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1))
      document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1))
      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(current - 1)
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') goTo(current + 1)
      })
      navDots.addEventListener('click', e => {
        const dot = e.target.closest('.nav-dot')
        if (dot) goTo(parseInt(dot.dataset.index))
      })

      // Card modal
      function openCardModal(html) {
        document.getElementById('cardModalContent').innerHTML = html
        document.getElementById('cardModal').classList.add('open')
      }
      function closeCardModal() {
        document.getElementById('cardModal').classList.remove('open')
      }
      document.getElementById('cardModalClose').addEventListener('click', closeCardModal)
      document.getElementById('cardModal').addEventListener('click', e => {
        if (e.target === e.currentTarget) closeCardModal()
      })
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeCardModal()
      })

      stage.addEventListener('click', e => {
        const card = e.target.closest('.feat-card, .prac-card, .impr-card, .usecase-card, [class*="blk-frame-"]')
        if (!card) return

        let html = ''
        const attachEl = card.querySelector('.card-attach')
        const attachHtml = attachEl ? attachEl.outerHTML : ''

        if (card.classList.contains('feat-card')) {
          const num = card.querySelector('.feat-num')?.textContent || ''
          const title = card.querySelector('h3')?.textContent || ''
          const desc = card.querySelector('p')?.textContent || ''
          html = `<h2><span class="accent">${esc(num)}.</span> ${esc(title)}</h2><p>${esc(desc)}</p>${attachHtml}`
        } else if (card.classList.contains('prac-card')) {
          const label = card.querySelector('.label')?.textContent || ''
          const title = card.querySelector('h3')?.textContent || ''
          const desc = card.querySelector('p')?.textContent || ''
          html = `<span class="cm-label">${esc(label)}</span><h2>${esc(title)}</h2><p>${esc(desc)}</p>${attachHtml}`
        } else if (card.classList.contains('impr-card')) {
          const quote = card.querySelector('.impr-quote')?.textContent || ''
          const author = card.querySelector('.impr-author')?.innerHTML || ''
          html = `<div class="cm-quote">${esc(quote)}</div><div class="cm-author">${author}</div>${attachHtml}`
        } else if (card.classList.contains('usecase-card')) {
          const icon = card.querySelector('.usecase-icon')?.innerHTML || ''
          const title = card.querySelector('h3')?.textContent || ''
          const desc = card.querySelector('p')?.textContent || ''
          const tag = card.querySelector('.usecase-tag')?.textContent || ''
          html = `<div style="text-align:center;font-size:48px;margin-bottom:16px">${icon}</div><h2 style="text-align:center">${esc(title)}</h2><p style="text-align:center">${esc(desc)}</p>${attachHtml}<div style="text-align:center;margin-top:12px"><span class="cm-label">${esc(tag)}</span></div>`
        } else {
          const clone = card.cloneNode(true)
          clone.style.cssText = 'border:none;box-shadow:none;background:transparent;padding:0;transform:none'
          html = clone.innerHTML
        }

        if (html) openCardModal(html)
      })

      document.getElementById('settingsBtn').addEventListener('click', () => {
        renderSettings()
        document.getElementById('settingsOverlay').classList.add('open')
      })
      document.getElementById('settingsReset').addEventListener('click', resetData)
      document.getElementById('settingsCancel').addEventListener('click', closeSettings)
      document.getElementById('settingsApply').addEventListener('click', applySettings)
      document.getElementById('settingsOverlay').addEventListener('click', e => {
        if (e.target === e.currentTarget) closeSettings()
      })

      window._rebuild = rebuild

      function scale() {
        const sw = 1920, sh = 1080
        const sx = window.innerWidth / sw, sy = window.innerHeight / sh
        const s = Math.min(sx, sy)
        stage.style.transform = `scale(${s})`
        stage.style.transformOrigin = '0 0'
        const top = (window.innerHeight - sh * s) / 2
        stage.style.marginTop = top > 0 ? `${top}px` : '0'
      }
      window.addEventListener('resize', scale)
      scale()
    }

    const stage = document.getElementById('stage')
    const navDots = document.getElementById('navDots')
    const counter = document.getElementById('navCounter')
  </script>
</body>
