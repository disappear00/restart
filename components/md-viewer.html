<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 预览</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#f5f5f4;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .bar{position:fixed;top:0;left:0;right:0;height:48px;z-index:100;display:flex;align-items:center;gap:8px;padding:0 16px;background:#fff;border-bottom:1px solid #e5e5e5}
  .bar label{font-size:13px;color:#888;white-space:nowrap}
  .bar input{flex:1;padding:6px 10px;border:1px solid #ddd;font-size:13px;font-family:Consolas,monospace;outline:none}
  .bar input:focus{border-color:#e11d48}
  .bar button{padding:6px 14px;border:1px solid #e11d48;background:#e11d48;color:#fff;font-size:13px;cursor:pointer;font-family:inherit}
  .bar button:hover{background:#be123c}
  .bar .sep{width:1px;height:20px;background:#e5e5e5;flex-shrink:0}
  .bar .zoom-group{display:flex;align-items:center;gap:4px}
  .bar .zoom-group button{padding:4px 8px;background:#fafafa;color:#555;border:1px solid #ddd;min-width:32px;font-size:13px}
  .bar .zoom-group button:hover{background:#f0f0f0;border-color:#bbb}
  .bar .zoom-group .zoom-val{font-size:12px;color:#888;min-width:36px;text-align:center;font-family:Consolas,monospace}
  .bar .toc-toggle{padding:4px 10px;background:#fafafa;color:#555;border:1px solid #ddd;font-size:13px}
  .bar .toc-toggle:hover{background:#f0f0f0;border-color:#bbb}
  .bar .toc-toggle.active{background:#e11d48;color:#fff;border-color:#e11d48}

  .toc-sidebar{
    position:fixed;top:48px;left:0;bottom:0;width:240px;z-index:90;
    background:#fff;border-right:1px solid #e5e5e5;
    overflow-y:auto;padding:16px 0;
    transform:translateX(-100%);transition:transform .25s ease
  }
  .toc-sidebar.open{transform:translateX(0)}
  .toc-sidebar h4{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:1px;padding:0 16px 8px}
  .toc-sidebar ul{list-style:none;padding:0;margin:0}
  .toc-sidebar li{margin:0}
  .toc-sidebar a{
    display:block;padding:5px 16px;font-size:13px;color:#555;text-decoration:none;
    border-left:2px solid transparent;transition:all .15s;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap
  }
  .toc-sidebar a:hover{color:#e11d48;background:#fef2f2}
  .toc-sidebar a.active{color:#e11d48;border-left-color:#e11d48;background:#fef2f2;font-weight:600}
  .toc-sidebar .toc-l1{padding-left:16px;font-weight:600;color:#333}
  .toc-sidebar .toc-l2{padding-left:28px}
  .toc-sidebar .toc-l3{padding-left:40px;font-size:12px;color:#777}
  .toc-sidebar .toc-l4{padding-left:52px;font-size:12px;color:#999}

  .viewer-wrap{transition:transform .25s ease}
  .viewer-wrap.shifted{transform:translateX(130px)}
  .viewer{max-width:820px;margin:48px auto 0;padding:0 20px;height:calc(100vh - 48px);overflow-y:auto}
  .md-body{background:#fff;padding:40px;border:1px solid #e5e5e5;border-top:none;line-height:1.8;color:#333}
  .md-body h1{font-size:28px;font-weight:700;margin:0 0 16px;padding-bottom:10px;border-bottom:2px solid #f0f0f0}
  .md-body h2{font-size:22px;font-weight:700;margin:28px 0 12px;padding-bottom:8px;border-bottom:1px solid #f0f0f0}
  .md-body h3{font-size:18px;font-weight:600;margin:24px 0 8px}
  .md-body h4{font-size:16px;font-weight:600;margin:20px 0 6px}
  .md-body p{margin:0 0 12px}
  .md-body ul,.md-body ol{margin:0 0 12px;padding-left:24px}
  .md-body li{margin-bottom:4px}
  .md-body blockquote{margin:12px 0;padding:10px 16px;border-left:4px solid #e11d48;background:#fef2f2;color:#555}
  .md-body pre{margin:14px 0;padding:14px 18px;background:#1c1917;color:#e7e5e4;font-family:Consolas,monospace;font-size:13px;line-height:1.6;overflow-x:auto;white-space:pre-wrap}
  .md-body code{font-family:Consolas,monospace;font-size:13px;background:#f3f3f3;padding:1px 5px}
  .md-body pre code{background:none;padding:0;color:inherit}
  .md-body img{max-width:100%;height:auto;margin:10px 0}
  .md-body table{border-collapse:collapse;width:100%;margin:12px 0}
  .md-body th,.md-body td{border:1px solid #ddd;padding:8px 12px;text-align:left}
  .md-body th{background:#fafafa;font-weight:600}
  .md-body hr{border:none;border-top:1px solid #eee;margin:20px 0}
  .md-body a{color:#e11d48;text-decoration:none}
  .md-body a:hover{text-decoration:underline}
  .hint{text-align:center;padding:80px 0;color:#aaa;font-size:15px;line-height:2.2}
  .hint code{background:#f3f3f3;padding:2px 8px;font-size:13px}
</style>
</head>
<body>

<div class="bar">
  <label>路径</label>
  <input id="pathInput" placeholder="输入 .md 文件路径，如 /README.md 或 ./docs/guide.md">
  <button onclick="loadMd()">加载</button>
  <div class="sep"></div>
  <button class="toc-toggle" id="tocToggle" onclick="toggleToc()">☰ 目录</button>
  <div class="sep"></div>
  <div class="zoom-group">
    <button onclick="zoomBy(-0.1)">−</button>
    <span class="zoom-val" id="zoomVal">150%</span>
    <button onclick="zoomBy(0.1)">+</button>
    <button onclick="zoomReset()">重置</button>
  </div>
</div>

<div class="toc-sidebar" id="tocSidebar">
  <h4>目录</h4>
  <ul id="tocList"></ul>
</div>

<div class="viewer-wrap" id="viewerWrap">
<div class="viewer">
  <div class="md-body" id="mdBody">
    <div class="hint">输入 Markdown 文件路径后点击「加载」<br>支持绝对路径 <code>/README.md</code> 和相对路径 <code>./docs/guide.md</code></div>
  </div>
</div>
</div>

<script>
const pathInput = document.getElementById('pathInput')
const mdBody = document.getElementById('mdBody')
const viewer = document.querySelector('.viewer')
const zoomVal = document.getElementById('zoomVal')
const tocSidebar = document.getElementById('tocSidebar')
const tocList = document.getElementById('tocList')
const tocToggle = document.getElementById('tocToggle')
const viewerWrap = document.getElementById('viewerWrap')
let zoomLevel = 1.5
let tocOpen = false
viewer.style.transform = 'scale(1.5)'
viewer.style.transformOrigin = 'top center'

function toggleToc() {
  tocOpen = !tocOpen
  tocSidebar.classList.toggle('open', tocOpen)
  viewerWrap.classList.toggle('shifted', tocOpen)
  tocToggle.classList.toggle('active', tocOpen)
}

function buildToc() {
  const headings = mdBody.querySelectorAll('h1,h2,h3,h4')
  tocList.innerHTML = ''
  headings.forEach((el, i) => {
    const level = parseInt(el.tagName[1])
    const id = 'heading-' + i
    el.id = id
    const li = document.createElement('li')
    const a = document.createElement('a')
    a.href = '#' + id
    a.textContent = el.textContent
    a.className = 'toc-l' + level
    a.addEventListener('click', e => {
      e.preventDefault()
      el.scrollIntoView({ behavior: 'smooth', block: 'start' })
      tocList.querySelectorAll('a').forEach(x => x.classList.remove('active'))
      a.classList.add('active')
    })
    li.appendChild(a)
    tocList.appendChild(li)
  })
}

function highlightTocOnScroll() {
  const headings = mdBody.querySelectorAll('h1,h2,h3,h4')
  if (!headings.length) return
  let current = headings[0]
  headings.forEach(h => {
    if (h.getBoundingClientRect().top <= 80) current = h
  })
  tocList.querySelectorAll('a').forEach(a => {
    a.classList.toggle('active', a.getAttribute('href') === '#' + current.id)
  })
}
document.querySelector('.viewer').addEventListener('scroll', highlightTocOnScroll)
window.addEventListener('scroll', highlightTocOnScroll)

function zoomBy(delta) {
  zoomLevel = Math.max(0.3, Math.min(3, +(zoomLevel + delta).toFixed(1)))
  viewer.style.transform = 'scale(' + zoomLevel + ')'
  viewer.style.transformOrigin = 'top center'
  zoomVal.textContent = Math.round(zoomLevel * 100) + '%'
}
function zoomReset() {
  zoomLevel = 1.5
  viewer.style.transform = 'scale(1.5)'
  viewer.style.transformOrigin = 'top center'
  zoomVal.textContent = '150%'
}
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === '=') { e.preventDefault(); zoomBy(0.1) }
  if (e.ctrlKey && e.key === '-') { e.preventDefault(); zoomBy(-0.1) }
  if (e.ctrlKey && e.key === '0') { e.preventDefault(); zoomReset() }
})

pathInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadMd() })

function loadMd() {
  const p = pathInput.value.trim()
  if (!p) return

  let url = p
  if (!/^https?:\/\//.test(p)) {
    url = p.startsWith('/') ? p : p
  }

  fetch(url)
    .then(r => {
      if (!r.ok) throw new Error(r.status + ' ' + r.statusText)
      return r.text()
    })
    .then(md => {
      mdBody.innerHTML = marked.parse(md)
      buildToc()
    })
    .catch(err => {
      mdBody.innerHTML = '<div class="hint">加载失败: ' + err.message + '<br>请确认路径正确</div>'
    })
}

const params = new URLSearchParams(location.search)
if (params.get('path')) {
  pathInput.value = params.get('path')
  loadMd()
}
</script>
</body>
</html>
