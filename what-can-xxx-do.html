<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XXX 可以做什么？</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#f5f0f0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif
  }

  .stage {
    position:relative; width:1920px; height:1080px;
    transform-origin:0 0; overflow:hidden;
    background:#fcfbfa; margin:0 auto
  }

  .slide {
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:80px 120px;
    opacity:0; pointer-events:none;
    transition:opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1);
    transform:scale(.97) translateY(20px)
  }
  .slide.active { opacity:1; pointer-events:auto; transform:scale(1) translateY(0) }

  .bg-white  { background:#fcfbfa }
  .bg-pink   { background:#fdf2f4 }
  .bg-blue   { background:#f0f4ff }
  .bg-warm   { background:#faf6f0 }
  .bg-dark   { background:#2d2a27 }
  .bg-rose   { background:linear-gradient(135deg, #fdf2f4 0%, #fcfbfa 40%, #f0f4ff 100%) }
  .bg-coral  { background:linear-gradient(135deg, #f0f4ff 0%, #fcfbfa 40%, #fdf2f4 100%) }

  h1 { font-size:74px; font-weight:700; color:#1c1917; letter-spacing:-2px; line-height:1.12 }
  h2 { font-size:42px; font-weight:600; color:#1c1917; letter-spacing:-.5px; line-height:1.2 }
  .slide[style*="color"] h1,
  .slide[style*="color"] h2,
  .slide[style*="color"] .pg-desc,
  .slide[style*="color"] .cover-sub,
  .slide[style*="color"] .feat-card h3,
  .slide[style*="color"] .feat-card p,
  .slide[style*="color"] .prac-card h3,
  .slide[style*="color"] .prac-card p,
  .slide[style*="color"] .score-label,
  .slide[style*="color"] .score-val,
  .slide[style*="color"] .usecase-card h3,
  .slide[style*="color"] .usecase-card p,
  .slide[style*="color"] .cta-title,
  .slide[style*="color"] .cta-sub,
  .slide[style*="color"] .impr-quote,
  .slide[style*="color"] .impr-author strong,
  .slide[style*="color"] .cta-feature .lbl,
  .slide[style*="color"] .cover-badge,
  .slide[style*="color"] .usecase-tag { color:inherit }

  .accent { color:#e11d48 }
  .page-tag {
    display:inline-block;
    background:#e11d48;
    color:#fff; font-size:11px; font-weight:700;
    padding:5px 16px;
    letter-spacing:1.5px; margin-bottom:20px;
    text-transform:uppercase;
    box-shadow:4px 4px 0 rgba(225,29,72,.2)
  }
  .pg-title   { margin-bottom:12px; text-align:center }
  .pg-desc {
    font-size:17px; color:#a8a29e;
    margin-bottom:40px; text-align:center;
    max-width:680px; line-height:1.7;
    font-weight:400
  }

  .divider {
    width:50px; height:4px;
    background:#e11d48;
    margin:20px auto 0
  }

  /* Wavy underline decoration */
  .wavy {
    position:relative;
    display:inline-block
  }
  .wavy::after {
    content:''; position:absolute;
    bottom:-2px; left:-4px; right:-4px;
    height:8px;
    background:url("data:image/svg+xml,%3Csvg width='100' height='8' viewBox='0 0 100 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 4 C10 0 20 8 30 4 C40 0 50 8 60 4 C70 0 80 8 90 4 L100 4' stroke='%23e11d48' stroke-width='1.5' fill='none' opacity='.35'/%3E%3C/svg%3E") repeat-x;
    background-size:50px 8px
  }

  /* Decorative blobs */
  .blob { position:absolute; pointer-events:none; z-index:0; border-radius:50% }
  .blob-1 {
    top:-160px; right:-140px; width:460px; height:460px;
    background:radial-gradient(circle, rgba(225,29,72,.06) 0%, transparent 65%);
    animation:blobDrift 8s ease-in-out infinite
  }
  .blob-2 {
    bottom:-140px; left:-120px; width:380px; height:380px;
    background:radial-gradient(circle, rgba(225,29,72,.04) 0%, transparent 65%);
    animation:blobDrift 10s ease-in-out infinite reverse
  }
  .blob-3 {
    top:50%; left:-180px; width:280px; height:280px;
    background:radial-gradient(circle, rgba(147,197,253,.06) 0%, transparent 65%);
    transform:translateY(-50%); animation:blobDrift 9s ease-in-out infinite
  }
  .blob-4 {
    bottom:-80px; right:-100px; width:320px; height:320px;
    background:radial-gradient(circle, rgba(225,29,72,.03) 0%, transparent 65%);
    animation:blobDrift 11s ease-in-out infinite reverse
  }
  .blob-5 {
    top:-60px; left:-60px; width:180px; height:180px;
    border:2px solid rgba(225,29,72,.06);
    animation:blobFloat 7s ease-in-out infinite
  }
  .blob-6 {
    bottom:-40px; right:-40px; width:140px; height:140px;
    border:2px solid rgba(147,197,253,.06);
    animation:blobFloat 9s ease-in-out infinite reverse
  }
  .blob-7 {
    top:140px; right:-120px; width:360px; height:360px;
    background:radial-gradient(circle, rgba(147,197,253,.05) 0%, transparent 65%);
    animation:blobDrift 8s ease-in-out infinite
  }

  @keyframes blobDrift { 0%,100%{opacity:.6;transform:scale(1)} 50%{opacity:1;transform:scale(1.06)} }
  @keyframes blobFloat { 0%,100%{transform:translate(0,0)} 50%{transform:translate(16px,-16px)} }
  @keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
  @keyframes fadeSlideUp {
    from{opacity:0;transform:translateY(20px)scale(.97)}
    to{opacity:1;transform:translateY(0)scale(1)}
  }

  .dot-grid {
    position:absolute; inset:0; pointer-events:none; z-index:0;
    opacity:.04;
    background-image:radial-gradient(#d4d4d8 1px, transparent 1px);
    background-size:32px 32px
  }

  /* ─── Slide 1: Cover ─── */
  .cover { overflow:hidden; padding:0 120px }
  .cover::before {
    content:''; position:absolute;
    top:-240px; right:-200px; width:650px; height:650px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(225,29,72,.07) 0%, transparent 60%);
    animation:blobDrift 7s ease-in-out infinite
  }
  .cover::after {
    content:''; position:absolute;
    bottom:-160px; left:-160px; width:450px; height:450px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(147,197,253,.06) 0%, transparent 60%);
    animation:blobDrift 9s ease-in-out infinite reverse
  }
  .cover-sub {
    font-size:22px; color:#a8a29e; margin-top:16px;
    text-align:center; max-width:760px; line-height:1.6;
    font-weight:400
  }
  .product-name { color:#e11d48 }
  .cover-badges { display:flex; gap:10px; margin-top:44px; flex-wrap:wrap; justify-content:center }
  .cover-badge {
    padding:8px 22px;
    font-size:13px; font-weight:600; color:#57534e;
    background:#fff;
    border:2px solid #e7e5e4;
    transition:all .25s ease;
    box-shadow:4px 4px 0 #e7e5e4
  }
  .cover-badge:hover {
    border-color:#e11d48;
    color:#e11d48;
    box-shadow:4px 4px 0 rgba(225,29,72,.2);
    transform:translate(-2px,-2px)
  }

  /* ─── Slide 2: Features ─── */
  .feat-wrap { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; width:100%; max-width:1500px; position:relative; z-index:1 }
  .feat-card {
    background:#fff;
    padding:28px 32px;
    border:2px solid #e7e5e4;
    flex:0 0 calc(50% - 10px); max-width:680px;
    display:flex; align-items:flex-start; gap:18px;
    transition:all .3s ease;
    box-shadow:6px 6px 0 #e7e5e4
  }
  .feat-card:hover {
    border-color:#e11d48;
    box-shadow:6px 6px 0 rgba(225,29,72,.2);
    transform:translate(-2px,-2px)
  }
  .feat-num {
    flex-shrink:0; width:44px; height:44px;
    background:#fef2f2; color:#e11d48;
    font-size:18px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    border:2px solid #fecaca
  }
  .feat-card h3 { font-size:22px; margin-bottom:6px; color:#292524; font-weight:600 }
  .feat-card p  { font-size:16px; color:#a8a29e; line-height:1.7; font-weight:400 }

  /* ─── Slide 3: Practice ─── */
  .prac-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; width:100%; max-width:1400px; position:relative; z-index:1 }
  .prac-card {
    background:#fff;
    padding:32px;
    transition:all .3s ease;
    border:2px solid #e7e5e4;
    box-shadow:6px 6px 0 #e7e5e4
  }
  .prac-card:hover {
    border-color:#e11d48;
    box-shadow:6px 6px 0 rgba(225,29,72,.2);
    transform:translate(-2px,-2px)
  }
  .prac-card .label {
    display:inline-block; font-size:11px; font-weight:700;
    color:#e11d48;
    background:#fef2f2;
    padding:3px 12px;
    margin-bottom:12px; letter-spacing:.5px;
    border:2px solid #fecaca
  }
  .prac-card h3    { font-size:20px; margin-bottom:8px; color:#292524; font-weight:600 }
  .prac-card p     { font-size:15px; color:#a8a29e; line-height:1.7; font-weight:400 }
  .prac-card .code {
    font-family:'SF Mono','Fira Code','Consolas',monospace;
    font-size:13px;
    background:#fafaf9;
    padding:14px 18px; margin-top:14px;
    color:#57534e; line-height:1.7; white-space:pre-wrap;
    border-left:4px solid #e11d48;
    border:2px solid #e7e5e4;
    border-left-width:4px
  }
  .prac-card .img-placeholder {
    width:100%; height:130px;
    background:#fafaf9;
    border:2px dashed #e7e5e4;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; color:#d6d3d1; margin-top:14px
  }
  .prac-card .code-img {
    margin-top:14px;
    border:2px solid #e7e5e4;
    background:#fafaf9;
    overflow:hidden
  }
  .prac-card .code-img img {
    display:block; width:100%; height:auto;
    max-height:280px; object-fit:contain
  }

  /* ─── Slide 4: Impressions ─── */
  .impr-wrap { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; width:100%; max-width:1400px; position:relative; z-index:1 }
  .impr-card {
    background:#fff;
    padding:32px;
    border:2px solid #e7e5e4;
    flex:0 0 calc(50% - 10px); max-width:650px;
    transition:all .3s ease;
    position:relative;
    box-shadow:6px 6px 0 #e7e5e4
  }
  .impr-card:hover {
    border-color:#e11d48;
    box-shadow:6px 6px 0 rgba(225,29,72,.2);
    transform:translate(-2px,-2px)
  }
  .impr-card::before {
    content:'"'; position:absolute; top:8px; left:16px;
    font-size:44px; color:#fecaca;
    font-weight:700; line-height:1; font-family:Georgia,serif
  }
  .impr-quote { font-size:18px; line-height:1.8; color:#57534e; font-style:italic; margin-bottom:18px; font-weight:400 }
  .impr-author { font-size:14px; color:#d6d3d1; font-style:normal }
  .impr-author strong { color:#a8a29e; font-weight:600 }

  /* ─── Slide 5: Scoring ─── */
  .score-wrap { display:flex; flex-direction:column; gap:20px; width:100%; max-width:1000px; position:relative; z-index:1 }
  .score-row  { display:flex; align-items:center; gap:20px }
  .score-label {
    width:110px; font-size:16px; font-weight:600;
    color:#57534e; flex-shrink:0; text-align:right
  }
  .score-bar-bg {
    flex:1; height:16px;
    background:#f5f5f4;
    border:2px solid #e7e5e4;
    overflow:hidden
  }
  .score-bar-fill {
    height:100%;
    background:#e11d48;
    transition:width 1.2s cubic-bezier(.22,1,.36,1);
    position:relative
  }
  .score-bar-fill::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent);
    animation:shimmer 2.5s infinite
  }
  .score-val {
    width:36px; font-size:18px; font-weight:700;
    color:#e11d48; flex-shrink:0;
    font-family:'SF Mono',monospace
  }
  .score-total { margin-top:28px; text-align:center }
  .score-total .big {
    font-size:54px; font-weight:700; color:#e11d48;
    font-family:'SF Mono',monospace; letter-spacing:-4px;
    text-shadow:3px 3px 0 #fecaca
  }
  .score-total .lbl { font-size:15px; color:#d6d3d1; margin-top:4px; font-weight:500 }

  /* ─── Slide 6: Use Cases ─── */
  .usecase-wrap { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; width:100%; max-width:1500px; position:relative; z-index:1 }
  .usecase-card {
    background:#fff;
    padding:32px 28px;
    border:2px solid #e7e5e4;
    flex:0 0 calc(33.33% - 14px); max-width:460px;
    text-align:center;
    transition:all .3s ease;
    box-shadow:6px 6px 0 #e7e5e4
  }
  .usecase-card:hover {
    transform:translate(-3px,-3px);
    border-color:#e11d48;
    box-shadow:6px 6px 0 rgba(225,29,72,.2)
  }
  .usecase-icon {
    width:60px; height:60px;
    margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center;
    font-size:26px;
    transition:transform .3s ease;
    border:2px solid #e7e5e4;
    background:#fafaf9
  }
  .usecase-card:hover .usecase-icon { transform:scale(1.08) }
  .usecase-card:nth-child(1) .usecase-icon { border-color:#fecaca; background:#fef2f2 }
  .usecase-card:nth-child(2) .usecase-icon { border-color:#bfdbfe; background:#eff6ff }
  .usecase-card:nth-child(3) .usecase-icon { border-color:#bbf7d0; background:#f0fdf4 }
  .usecase-card:nth-child(4) .usecase-icon { border-color:#fde68a; background:#fffbeb }
  .usecase-card:nth-child(5) .usecase-icon { border-color:#ddd6fe; background:#f5f3ff }
  .usecase-card:nth-child(6) .usecase-icon { border-color:#fbcfe8; background:#fdf2f8 }
  .usecase-card h3 { font-size:20px; margin-bottom:8px; color:#292524; font-weight:600 }
  .usecase-card p  { font-size:14px; color:#a8a29e; line-height:1.7; font-weight:400 }
  .usecase-tag {
    display:inline-block; font-size:11px; font-weight:600;
    color:#d6d3d1;
    background:#fafaf9;
    padding:3px 12px; margin-top:12px;
    border:2px solid #e7e5e4
  }

  /* ─── Slide 7: CTA / Conclusion ─── */
  .cta { overflow:hidden }
  .cta::before {
    content:''; position:absolute;
    top:-280px; right:-200px; width:650px; height:650px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(225,29,72,.07) 0%, transparent 55%);
    animation:blobDrift 8s ease-in-out infinite
  }
  .cta::after {
    content:''; position:absolute;
    bottom:-180px; left:-180px; width:450px; height:450px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(147,197,253,.05) 0%, transparent 55%);
    animation:blobDrift 10s ease-in-out infinite reverse
  }
  .cta-title {
    font-size:54px; font-weight:700; color:#1c1917;
    text-align:center; margin-bottom:14px; line-height:1.2;
    position:relative; z-index:1; letter-spacing:-1px
  }
  .cta-sub {
    font-size:18px; color:#a8a29e; text-align:center;
    max-width:640px; line-height:1.6; margin-bottom:44px;
    position:relative; z-index:1; font-weight:400
  }
  .cta-btn {
    display:inline-block; padding:16px 48px;
    background:#e11d48;
    color:#fff; font-size:18px; font-weight:700;
    border:2px solid #e11d48;
    cursor:pointer;
    transition:all .25s ease;
    text-decoration:none; font-family:inherit;
    position:relative; z-index:1;
    letter-spacing:.5px;
    box-shadow:6px 6px 0 rgba(225,29,72,.25)
  }
  .cta-btn:hover {
    background:#be123c;
    border-color:#be123c;
    box-shadow:4px 4px 0 rgba(225,29,72,.3);
    transform:translate(2px,2px)
  }
  .cta-btn:active { transform:translate(4px,4px); box-shadow:none }
  .cta-features { display:flex; gap:48px; margin-bottom:36px; position:relative; z-index:1 }
  .cta-feature { text-align:center }
  .cta-feature .num {
    font-size:36px; font-weight:700; color:#e11d48;
    font-family:'SF Mono',monospace; letter-spacing:-2px;
    text-shadow:3px 3px 0 #fecaca
  }
  .cta-feature .lbl { font-size:13px; color:#d6d3d1; margin-top:4px; font-weight:500 }

  /* ─── Navigation ─── */
  .nav-bar {
    position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:14px;
    background:#fff;
    border:2px solid #e7e5e4;
    padding:8px 18px;
    z-index:1000;
    box-shadow:6px 6px 0 #e7e5e4
  }
  .nav-btn {
    width:36px; height:36px;
    border:2px solid #e7e5e4;
    background:#fafaf9;
    color:#a8a29e; font-size:14px;
    cursor:pointer; display:flex;
    align-items:center; justify-content:center;
    transition:all .2s ease
  }
  .nav-btn:hover { border-color:#e11d48; color:#e11d48; background:#fef2f2 }
  .nav-dots { display:flex; gap:6px }
  .nav-dot {
    width:10px; height:10px;
    background:#e7e5e4; border:none;
    cursor:pointer; padding:0;
    transition:all .3s ease
  }
  .nav-dot.active { background:#e11d48; box-shadow:2px 2px 0 rgba(225,29,72,.25) }
  .nav-dot:hover:not(.active) { background:#d6d3d1 }
  .nav-counter { font-size:12px; color:#d6d3d1; font-weight:600; min-width:36px; text-align:center }

  /* ─── Settings Button ─── */
  .settings-btn {
    position:fixed; right:24px; top:24px;
    width:38px; height:38px;
    border:2px solid #e7e5e4;
    background:#fff;
    color:#d6d3d1; font-size:16px; cursor:pointer;
    z-index:2000; display:flex;
    align-items:center; justify-content:center;
    transition:all .25s ease; user-select:none
  }
  .settings-btn:hover {
    border-color:#e11d48; color:#e11d48;
    box-shadow:3px 3px 0 rgba(225,29,72,.15);
    transform:translate(-1px,-1px)
  }

  /* ─── Settings Panel ─── */
  .settings-overlay {
    position:fixed; inset:0;
    background:rgba(28,25,23,.3);
    z-index:3000; display:none;
    align-items:center; justify-content:center
  }
  .settings-overlay.open { display:flex }
  .settings-panel {
    background:#fcfbfa;
    width:960px; max-height:85vh;
    overflow-y:auto;
    box-shadow:12px 12px 0 rgba(28,25,23,.08);
    border:2px solid #e7e5e4;
    padding:36px 44px; animation:fadeSlideUp .35s ease
  }
  .settings-panel::-webkit-scrollbar { width:6px }
  .settings-panel::-webkit-scrollbar-thumb { background:#e11d48 }
  .settings-panel::-webkit-scrollbar-track { background:#f5f5f4 }

  .settings-panel h2 { font-size:26px; margin-bottom:6px; letter-spacing:-.3px; color:#292524; font-weight:700 }
  .settings-panel .hint { font-size:14px; color:#d6d3d1; margin-bottom:28px; font-weight:400 }
  .settings-section {
    margin-bottom:28px; padding-bottom:24px;
    border-bottom:2px solid #f5f5f4
  }
  .settings-section:last-child { border-bottom:none; margin-bottom:0; padding-bottom:0 }
  .settings-section h3 {
    font-size:16px; color:#57534e; margin-bottom:16px;
    display:flex; align-items:center; gap:8px;
    font-weight:600
  }
  .settings-section h3::before {
    content:''; display:inline-block;
    width:4px; height:18px;
    background:#e11d48
  }

  .s-field { margin-bottom:14px }
  .s-field label {
    display:block; font-size:12px; font-weight:600;
    color:#a8a29e; margin-bottom:4px; white-space:nowrap
  }
  .s-field input,.s-field textarea {
    width:100%; padding:10px 14px;
    border:2px solid #e7e5e4;
    font-size:14px;
    font-family:inherit; color:#292524; outline:none;
    transition:all .2s ease;
    background:#fff
  }
  .s-field input:focus,.s-field textarea:focus {
    border-color:#e11d48;
    box-shadow:3px 3px 0 rgba(225,29,72,.1);
    background:#fff
  }
  .s-field textarea { resize:vertical; min-height:56px; line-height:1.5 }

  .s-row {
    display:flex; gap:12px; align-items:flex-end;
    margin-bottom:10px; padding:12px 14px;
    background:#fafaf9;
    border:2px solid #f5f5f4
  }
  .s-row .s-field { margin-bottom:0; flex:1 }
  .s-del {
    width:30px; height:30px;
    border:2px solid #fecaca;
    background:#fef2f2;
    color:#ef4444; font-size:13px; cursor:pointer;
    flex-shrink:0; display:flex; align-items:center;
    justify-content:center; transition:all .2s; line-height:1
  }
  .s-del:hover { background:#fee2e2; border-color:#fca5a5 }
  .s-add {
    margin-top:6px; padding:7px 16px;
    border:2px dashed #e7e5e4;
    background:transparent;
    color:#d6d3d1; font-size:13px; cursor:pointer;
    transition:all .2s; font-family:inherit;
    font-weight:500
  }
  .s-add:hover {
    border-color:#e11d48;
    color:#e11d48;
    background:#fef2f2
  }

  .s-actions {
    display:flex; gap:12px; justify-content:flex-end;
    margin-top:8px; padding-top:18px;
    border-top:2px solid #f5f5f4
  }
  .s-btn {
    padding:10px 28px;
    border:2px solid #e7e5e4;
    background:#fff;
    font-size:14px; font-weight:600;
    cursor:pointer; transition:all .2s ease;
    font-family:inherit;
    color:#a8a29e
  }
  .s-btn-primary {
    background:#e11d48;
    color:#fff;
    border-color:#e11d48;
    box-shadow:4px 4px 0 rgba(225,29,72,.2)
  }
  .s-btn-primary:hover {
    background:#be123c;
    border-color:#be123c;
    box-shadow:3px 3px 0 rgba(225,29,72,.25);
    transform:translate(1px,1px)
  }
  .s-btn-cancel { background:#fafaf9 }
  .s-btn-cancel:hover {
    background:#f5f5f4;
    border-color:#d6d3d1;
    transform:translate(1px,1px);
    box-shadow:2px 2px 0 #e7e5e4
  }

  .s-field.s-sm { flex:0 0 100px }
  .s-field.s-num input { text-align:center }
  .s-field input[type="color"] {
    width:44px; height:36px; padding:2px;
    cursor:pointer; border:2px solid #e7e5e4
  }
  .preset-wrap { display:flex; flex-wrap:wrap; gap:8px }
  .preset-btn {
    display:flex; align-items:center; gap:4px;
    padding:6px 10px; border:2px solid #e7e5e4;
    background:#fff; cursor:pointer;
    transition:all .2s ease; font-family:inherit;
    font-size:11px; color:#57534e; font-weight:500
  }
  .preset-btn:hover {
    border-color:#e11d48;
    box-shadow:2px 2px 0 rgba(225,29,72,.12);
    transform:translate(-1px,-1px)
  }
  .preset-btn span { border-radius:0; flex-shrink:0 }
  .preset-name { margin-left:2px }

  /* ─── Cartoon Text ─── */
  .cartoon-text {
    position:fixed; bottom:100px; left:24px;
    z-index:998;
    font-size:44px; font-weight:900;
    font-family:'Comic Sans MS','Chalkboard SE','Segoe Print','PingFang SC','Microsoft YaHei',cursive;
    color:#e11d48;
    text-shadow:3px 3px 0 #fecaca, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
    cursor:default; user-select:none;
    line-height:1.2; pointer-events:none;
    letter-spacing:2px;
    display:inline-block;
    white-space:pre
  }
  .ct-char {
    display:inline-block;
    transform-origin:center bottom
  }
  .ct-char.anim-bounce  { animation:bounce 1.6s ease-in-out infinite }
  .ct-char.anim-wiggle  { animation:animWiggle .7s ease-in-out infinite }
  .ct-char.anim-spin    { animation:animSpin 2.2s linear infinite }
  .ct-char.anim-pulse   { animation:animPulse 1.3s ease-in-out infinite }
  .ct-char.anim-shake   { animation:animShake .6s ease-in-out infinite }
  .ct-char.anim-float   { animation:animFloat 3.2s ease-in-out infinite }

  @keyframes bounce {
    0%,100% { transform:translateY(0) scale(1,1) }
    20% { transform:translateY(-22px) scale(1.06,.94) }
    40% { transform:translateY(0) scale(.96,1.04) }
    55% { transform:translateY(-10px) scale(1.02,.98) }
    70% { transform:translateY(0) scale(.99,1.01) }
  }
  @keyframes animWiggle {
    0%,100% { transform:rotate(0deg) }
    25% { transform:rotate(-8deg) }
    75% { transform:rotate(8deg) }
  }
  @keyframes animSpin {
    0% { transform:rotate(0deg) scale(1) }
    50% { transform:rotate(180deg) scale(1.08) }
    100% { transform:rotate(360deg) scale(1) }
  }
  @keyframes animPulse {
    0%,100% { transform:scale(1) }
    50% { transform:scale(1.18) }
  }
  @keyframes animShake {
    0%,100% { transform:translateX(0) }
    20% { transform:translateX(-8px) rotate(-3deg) }
    40% { transform:translateX(8px) rotate(3deg) }
    60% { transform:translateX(-5px) rotate(-2deg) }
    80% { transform:translateX(5px) rotate(2deg) }
  }
  @keyframes animFloat {
    0%,100% { transform:translateY(0) rotate(-1deg) }
    33% { transform:translateY(-14px) rotate(2deg) }
    66% { transform:translateY(-5px) rotate(-1deg) }
  }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<button class="settings-btn" id="settingsBtn" title="编辑内容">⚙</button>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel" id="settingsPanel">
    <h2>编辑内容</h2>
    <p class="hint">修改后点击「应用」即时更新幻灯片</p>
    <div id="settingsBody"></div>
    <div class="s-actions">
      <button class="s-btn" style="background:transparent;color:#d6d3d1;font-size:12px;margin-right:auto;border:2px solid #f5f5f4;font-weight:500" id="settingsReset">恢复默认</button>
      <button class="s-btn s-btn-cancel" id="settingsCancel">取消</button>
      <button class="s-btn s-btn-primary" id="settingsApply">应用</button>
    </div>
  </div>
</div>

<div class="nav-bar" id="navBar">
  <button class="nav-btn" id="prevBtn">◀</button>
  <div class="nav-dots" id="navDots"></div>
  <span class="nav-counter" id="navCounter">1 / 7</span>
  <button class="nav-btn" id="nextBtn">▶</button>
</div>

<div class="cartoon-text" id="cartoonText">加油！</div>

<script>
let DATA = {}

const STORAGE_KEY = 'what-can-xxx-do-data-v2'

function loadSavedData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY)
    if (raw) {
      const saved = JSON.parse(raw)
      deepMerge(DATA, saved)
    }
  } catch (_) {}
}

function deepMerge(target, source) {
  Object.keys(source).forEach(k => {
    if (Array.isArray(source[k])) {
      target[k] = source[k]
    } else if (typeof source[k] === 'object' && source[k] !== null && typeof target[k] === 'object') {
      deepMerge(target[k], source[k])
    } else {
      target[k] = source[k]
    }
  })
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA))
}

fetch('data.json')
  .then(r => r.json())
  .then(json => {
    DATA = json
    loadSavedData()
    migrateOldStorage()
    init()
  })
  .catch(() => {
    init()
  })

function migrateOldStorage() {
  try {
    const oldRaw = localStorage.getItem('what-can-xxx-do-data')
    if (oldRaw) {
      const old = JSON.parse(oldRaw)
      if (old.features && Array.isArray(old.features) && !localStorage.getItem(STORAGE_KEY)) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          cover: old.cover || DATA.cover,
          features: { title: DATA.features?.title, desc: DATA.features?.desc, items: old.features },
          practices: { title: DATA.practices?.title, desc: DATA.practices?.desc, items: old.practices },
          impressions: { title: DATA.impressions?.title, desc: DATA.impressions?.desc, items: old.impressions },
          scores: { title: DATA.scores?.title, desc: DATA.scores?.desc, items: old.scores },
          usecases: DATA.usecases,
          cta: DATA.cta,
        }))
      }
    }
  } catch (_) {}
}

function renderSlides() {
  const { cover, features, practices, impressions, scores, usecases, cta } = DATA

  const avg = scores.items.length
    ? (scores.items.reduce((s, x) => s + x.value, 0) / scores.items.length).toFixed(1)
    : '0.0'

  function sc(section, cls) {
    let s = ''
    if (section.bg) s += `background:${esc(section.bg)};`
    if (section.fg) s += `color:${esc(section.fg)};`
    return s ? `style="${s}"` : `class="${cls}"`
  }

  return [
    // ── 1. Cover ──
    `<div class="slide cover active" ${sc(cover, 'bg-white')}>
      <div class="deco deco-1"></div>
      <div class="deco deco-2"></div>
      <div class="dot-grid"></div>
      <h1><span class="product-name">${esc(cover.product)}</span> 可以做什么？</h1>
      <div class="divider"></div>
      <p class="cover-sub">${esc(cover.subtitle)}</p>
      <p style="margin-top:28px;font-size:15px;color:#d6d3d1;letter-spacing:4px">——— ${esc(cover.tagline)} ———</p>
      <div class="cover-badges" style="margin-top:36px">${
        cover.badges.map(b => `<span class="cover-badge">${esc(b)}</span>`).join('')
      }</div>
    </div>`,

    // ── 2. Features ──
    `<div class="slide" ${sc(features, 'bg-rose')}>
      <div class="deco deco-3"></div>
      <div class="page-tag">特点</div>
      <h2 class="pg-title">${esc(cover.product)} 的<span class="accent"> ${esc(features.title)}</span></h2>
      <p class="pg-desc">${esc(features.desc)}</p>
      <div class="feat-wrap">${
        features.items.map((f, i) => `
          <div class="feat-card">
            <div class="feat-num">${i + 1}</div>
            <div>
              <h3>${esc(f.title)}</h3>
              <p>${esc(f.desc)}</p>
            </div>
          </div>
        `).join('')
      }</div>
    </div>`,

    // ── 3. Practice ──
    `<div class="slide" ${sc(practices, 'bg-white')}>
      <div class="deco deco-4"></div>
      <div class="page-tag">测试实践</div>
      <h2 class="pg-title">${esc(practices.title)}</h2>
      <p class="pg-desc">${esc(practices.desc)}</p>
      <div class="prac-grid">${
        practices.items.map(p => `
          <div class="prac-card">
            <span class="label">${esc(p.label)}</span>
            <h3>${esc(p.title)}</h3>
            <p>${esc(p.desc)}</p>
            ${p.code ? (isImagePath(p.code) ? `<div class="code-img"><img src="${esc(p.code)}" alt="${esc(p.title)}"></div>` : `<div class="code">${esc(p.code)}</div>`) : '<div class="img-placeholder">[ 截图待添加 ]</div>'}
          </div>
        `).join('')
      }</div>
    </div>`,

    // ── 4. Impressions ──
    `<div class="slide" ${sc(impressions, 'bg-pink')}>
      <div class="deco deco-5"></div>
      <div class="deco deco-6"></div>
      <div class="page-tag">使用感想</div>
      <h2 class="pg-title">${esc(impressions.title)}</h2>
      <p class="pg-desc">${esc(impressions.desc)}</p>
      <div class="impr-wrap">${
        impressions.items.map(im => `
          <div class="impr-card">
            <div class="impr-quote">${esc(im.quote)}</div>
            <div class="impr-author">—— <strong>${esc(im.author)}</strong></div>
          </div>
        `).join('')
      }</div>
    </div>`,

    // ── 5. Scoring ──
    `<div class="slide" ${sc(scores, 'bg-coral')}>
      <div class="deco deco-7"></div>
      <div class="page-tag">综合评分</div>
      <h2 class="pg-title">为 ${esc(cover.product)} <span class="accent">${esc(scores.title)}</span></h2>
      <p class="pg-desc">${esc(scores.desc)}</p>
      <div class="score-wrap">${
        scores.items.map(s => `
          <div class="score-row">
            <span class="score-label">${esc(s.label)}</span>
            <div class="score-bar-bg"><div class="score-bar-fill" style="width:${Math.max(0, Math.min(100, s.value))}%"></div></div>
            <span class="score-val">${s.value}</span>
          </div>
        `).join('')
      }</div>
      <div class="score-total">
        <div class="big">${avg}</div>
        <div class="lbl">综合评分（满分 100）</div>
      </div>
    </div>`,

    // ── 6. Use Cases ──
    `<div class="slide" ${sc(usecases, 'bg-white')}>
      <div class="page-tag">场景</div>
      <h2 class="pg-title">${esc(usecases.title)}</h2>
      <p class="pg-desc">${esc(usecases.desc)}</p>
      <div class="usecase-wrap">${
        usecases.items.map(u => `
          <div class="usecase-card">
            <div class="usecase-icon">${esc(u.icon)}</div>
            <h3>${esc(u.title)}</h3>
            <p>${esc(u.desc)}</p>
            <span class="usecase-tag">${esc(u.tag)}</span>
          </div>
        `).join('')
      }</div>
    </div>`,

    // ── 7. CTA / Conclusion ──
    `<div class="slide cta" ${sc(cta, 'bg-warm')}>
      <div class="deco deco-1"></div>
      <div class="deco deco-2"></div>
      <div class="dot-grid"></div>
      <div class="cta-features">${
        cta.features.map(f => `
          <div class="cta-feature">
            <div class="num">${esc(f.num)}</div>
            <div class="lbl">${esc(f.lbl)}</div>
          </div>
        `).join('')
      }</div>
      <div class="cta-title">${esc(cta.title)}</div>
      <p class="cta-sub">${esc(cta.subtitle)}</p>
      <button class="cta-btn">${esc(cta.btnText)}</button>
    </div>`,
  ]
}

function esc(s) {
  const d = document.createElement('div')
  d.textContent = s
  return d.innerHTML
}
function isImagePath(s) {
  return /\.(png|jpg|jpeg|gif|webp|svg|bmp)(\?.*)?$/i.test(s)
}
function getCartoonText() {
  if (!DATA.cartoonText) DATA.cartoonText = { text: '加油！', anims: ['bounce','wiggle','pulse'] }
  if (!DATA.cartoonText.anims) DATA.cartoonText.anims = []
  while (DATA.cartoonText.anims.length < DATA.cartoonText.text.length) DATA.cartoonText.anims.push('bounce')
  while (DATA.cartoonText.anims.length > DATA.cartoonText.text.length) DATA.cartoonText.anims.pop()
  return DATA.cartoonText
}
function updateCartoonText() {
  const el = document.getElementById('cartoonText')
  if (!el) return
  const cfg = getCartoonText()
  const text = cfg.text || ''
  const anims = cfg.anims || []
  el.innerHTML = ''
  for (let i = 0; i < text.length; i++) {
    const ch = text[i]
    const span = document.createElement('span')
    span.textContent = ch === ' ' ? '\u00A0' : ch
    const anim = anims[i] || 'bounce'
    span.className = 'ct-char anim-' + anim
    el.appendChild(span)
  }
}
function renderCartoonCharAnims() {
  const container = document.getElementById('ct-char-anims')
  if (!container) return
  const input = document.getElementById('ct-text-input')
  if (!input) return
  const text = input.value
  const cfg = getCartoonText()
  while (cfg.anims.length < text.length) cfg.anims.push('bounce')
  while (cfg.anims.length > text.length) cfg.anims.pop()
  container.innerHTML = ''
  for (let i = 0; i < text.length; i++) {
    const ch = text[i]
    const anim = cfg.anims[i] || 'bounce'
    const box = document.createElement('div')
    box.style.cssText = 'text-align:center;border:2px solid #e7e5e4;padding:6px 8px;background:#fff;min-width:56px'
    box.innerHTML =
      '<div style="font-size:22px;font-weight:900;margin-bottom:2px;line-height:1.2">' + esc(ch) + '</div>' +
      '<select class="ct-anim-sel" style="width:100%;padding:3px;border:2px solid #e7e5e4;font-size:11px;font-family:inherit;background:#fff;color:#292524;outline:none">' +
        '<option value="bounce"'  + (anim==='bounce'?' selected':'') + '>弹跳</option>' +
        '<option value="wiggle"'  + (anim==='wiggle'?' selected':'') + '>摆动</option>' +
        '<option value="spin"'    + (anim==='spin'?' selected':'') + '>旋转</option>' +
        '<option value="pulse"'   + (anim==='pulse'?' selected':'') + '>脉动</option>' +
        '<option value="shake"'   + (anim==='shake'?' selected':'') + '>抖动</option>' +
        '<option value="float"'   + (anim==='float'?' selected':'') + '>漂浮</option>' +
      '</select>'
    container.appendChild(box)
  }
}
function collectCartoonAnims() {
  const selects = document.querySelectorAll('.ct-anim-sel')
  const cfg = getCartoonText()
  cfg.anims = []
  selects.forEach(sel => cfg.anims.push(sel.value))
}

const PRESETS = [
  {
    name: '经典粉白',
    bgs: ['#fcfbfa','#fdf2f4','#fcfbfa','#fdf2f4','#fcfbfa','#fcfbfa','#faf6f0'],
    fgs: ['','','','','','','']
  },
  {
    name: '清新薄荷',
    bgs: ['#f0fdf4','#ecfdf5','#f0fdf4','#ecfdf5','#f0fdf4','#f0fdf4','#f0fdf4'],
    fgs: ['','','','','','','']
  },
  {
    name: '天空蓝调',
    bgs: ['#eff6ff','#f0f4ff','#eff6ff','#f0f4ff','#eff6ff','#eff6ff','#eff6ff'],
    fgs: ['','','','','','','']
  },
  {
    name: '暖阳橙调',
    bgs: ['#fff7ed','#fefce8','#fff7ed','#fefce8','#fff7ed','#fff7ed','#fff7ed'],
    fgs: ['','','','','','','']
  },
  {
    name: '薰衣草紫',
    bgs: ['#f5f3ff','#faf5ff','#f5f3ff','#faf5ff','#f5f3ff','#f5f3ff','#f5f3ff'],
    fgs: ['','','','','','','']
  },
  {
    name: '奶油黄',
    bgs: ['#fefce8','#fffbeb','#fefce8','#fffbeb','#fefce8','#fefce8','#fefce8'],
    fgs: ['','','','','','','']
  },
  {
    name: '静谧雾灰',
    bgs: ['#fafaf9','#f5f5f4','#fafaf9','#f5f5f4','#fafaf9','#fafaf9','#fafaf9'],
    fgs: ['','','','','','','']
  },
  {
    name: '珊瑚粉橘',
    bgs: ['#fff1f2','#fef2f2','#fff1f2','#fef2f2','#fff1f2','#fff1f2','#fff1f2'],
    fgs: ['','','','','','','']
  },
  {
    name: '暗夜高级',
    bgs: ['#1c1917','#292524','#1c1917','#292524','#1c1917','#1c1917','#1c1917'],
    fgs: ['#fafaf9','#fafaf9','#fafaf9','#fafaf9','#fafaf9','#fafaf9','#fafaf9']
  },
  {
    name: '纯净白',
    bgs: ['#ffffff','#fcfbfa','#ffffff','#fcfbfa','#ffffff','#ffffff','#ffffff'],
    fgs: ['','','','','','','']
  }
]

const PRESET_KEYS = ['cover.bg','features.bg','practices.bg','impressions.bg','scores.bg','usecases.bg','cta.bg',
                     'cover.fg','features.fg','practices.fg','impressions.fg','scores.fg','usecases.fg','cta.fg']

function applyPreset(idx) {
  const p = PRESETS[idx]
  if (!p) return
  const allColors = [...p.bgs, ...p.fgs]
  allColors.forEach((c, i) => {
    const parts = PRESET_KEYS[i].split('.')
    let obj = DATA
    for (let j = 0; j < parts.length - 1; j++) obj = obj[parts[j]]
    obj[parts[parts.length - 1]] = c
    const input = document.querySelector(`#settingsBody [data-path="${PRESET_KEYS[i]}"]`)
    if (input) {
      const isFg = parts[parts.length - 1] === 'fg'
      input.value = c || (isFg ? '#1c1917' : '#ffffff')
    }
  })
}

function renderSettings() {
  const D = DATA
  let html = ''

  html += `<div class="settings-section">
    <h3>推荐配色</h3>
    <div class="preset-wrap">`
  PRESETS.forEach((p, i) => {
    html += `<button class="preset-btn" onclick="applyPreset(${i})" title="${p.name}">
      ${p.bgs.map((c, j) => {
        const dot = `<span style="background:${c};display:inline-block;width:14px;height:14px"></span>`
        return p.fgs[j] ? `${dot}<span style="color:${p.fgs[j]};font-size:8px;display:inline-block;width:8px;margin-left:-3px">●</span>` : dot
      }).join('')}
      <span class="preset-name">${p.name}</span>
    </button>`
  })
  html += `</div></div>`

  // ── Cover ──
  html += `<div class="settings-section">
    <h3>标题页</h3>
    <div class="s-row">
      <div class="s-field" style="max-width:80px"><label>背景</label><input type="color" data-path="cover.bg" value="${D.cover.bg || '#fcfbfa'}"></div>
      <div class="s-field" style="max-width:80px"><label>文字</label><input type="color" data-path="cover.fg" value="${D.cover.fg || '#1c1917'}"></div>
    </div>
    <div class="s-field"><label>产品名称</label><input data-path="cover.product" value="${esc(D.cover.product)}"></div>
    <div class="s-field"><label>副标题</label><input data-path="cover.subtitle" value="${esc(D.cover.subtitle)}"></div>
    <div class="s-field"><label>标语</label><input data-path="cover.tagline" value="${esc(D.cover.tagline)}"></div>
    <div id="s-badge-list">`
  D.cover.badges.forEach((b, i) => {
    html += `<div class="s-row" data-idx="${i}">
      <div class="s-field"><label>标签 ${i+1}</label><input data-path="cover.badges.${i}" value="${esc(b)}"></div>
      <button class="s-del" onclick="deleteCoverBadge(${i})" title="删除">✕</button>
    </div>`
  })
  html += `</div>
    <button class="s-add" onclick="addCoverBadge()">＋ 添加标签</button>
  </div>`

  // ── Features ──
  html += `<div class="settings-section">
    <h3>特点 <span style="font-weight:400;font-size:12px;color:#d6d3d1">（每条自动编号，可增减）</span></h3>
    <div class="s-row">

  </div>`

  // ── Scores ──
  html += `<div class="settings-section">
    <h3>打分 <span style="font-weight:400;font-size:12px;color:#d6d3d1">（1-100，可增减）</span></h3>
    <div class="s-row">

    <div class="s-field" style="flex:1"><label>区域描述</label><input data-path="scores.desc" value="${esc(D.scores.desc)}"></div>

    html += `<div class="s-row" data-idx="${i}">

  html += `</div>

  html += `<div class="settings-section">

    <div class="s-field" style="flex:1"><label>区域描述</label><input data-path="usecases.desc" value="${esc(D.usecases.desc)}"></div>
    <div id="s-usecase-list">`
  D.usecases.items.forEach((u, i) => {
    html += `<div class="s-row" data-idx="${i}">
      <div class="s-field" style="flex:0 0 60px"><label>图标</label><input data-path="usecases.items.${i}.icon" value="${esc(u.icon)}"></div>

      <div class="s-field"><label>描述</label><input data-path="usecases.items.${i}.desc" value="${esc(u.desc)}"></div>

  // ── CTA ──

      <div class="s-field" style="max-width:80px"><label>文字</label><input type="color" data-path="cta.fg" value="${D.cta.fg || '#1c1917'}"></div>
    </div>
    <div class="s-field"><label>标题</label><input data-path="cta.title" value="${esc(D.cta.title)}"></div>
    <div class="s-field"><label>副标题</label><input data-path="cta.subtitle" value="${esc(D.cta.subtitle)}"></div>
    <div class="s-field"><label>按钮文字</label><input data-path="cta.btnText" value="${esc(D.cta.btnText)}"></div>
    <div id="s-cta-feat-list">`
  D.cta.features.forEach((f, i) => {
    html += `<div class="s-row" data-idx="${i}">
      <div class="s-field" style="flex:0 0 80px"><label>数字</label><input data-path="cta.features.${i}.num" value="${esc(f.num)}"></div>
      <div class="s-field"><label>标签</label><input data-path="cta.features.${i}.lbl" value="${esc(f.lbl)}"></div>
      <button class="s-del" onclick="deleteCtaFeature(${i})" title="删除">✕</button>

  html += `</div>

  // ── Cartoon Text ──
  const ctCfg = getCartoonText()
  html += `<div class="settings-section">
    <h3>左下角卡通字</h3>

}

function addFeature() {
  DATA.features.items.push({ title: '新特点', desc: '请输入描述' })
  renderSettings()
}
function addPractice() {
  DATA.practices.items.push({ label: '新场景', title: '场景标题', desc: '请输入描述', code: '' })
  renderSettings()
}
function addImpression() {
  DATA.impressions.items.push({ quote: '请输入感想内容', author: '姓名 · 身份' })
  renderSettings()
}
function addScore() {
  DATA.scores.items.push({ label: '新维度', value: 80 })
  renderSettings()
}
function addUseCase() {
  DATA.usecases.items.push({ icon: '🚀', title: '新场景', desc: '请输入描述', tag: '分类' })
  renderSettings()
}
function addCoverBadge() {
  DATA.cover.badges.push('新标签')
  renderSettings()
}
function addCtaFeature() {
  DATA.cta.features.push({ num: '10x', lbl: '效率提升' })
  renderSettings()
}

function deleteItem(arr, idx) {
  const keys = arr.split('.')
  let obj = DATA
  for (let i = 0; i < keys.length; i++) obj = obj[keys[i]]
  obj.splice(idx, 1)
  renderSettings()
}

function deleteCoverBadge(idx) {
  DATA.cover.badges.splice(idx, 1)
  renderSettings()
}

function deleteCtaFeature(idx) {
  DATA.cta.features.splice(idx, 1)
  renderSettings()
}

function editCode(idx) {
  window._codeToEdit = idx
  const v = DATA.practices.items[idx].code
  const ta = prompt('编辑代码内容（支持换行）：', v)
  if (ta !== null) {
    DATA.practices.items[idx].code = ta
    applySettings()
  }
}

function collectSettings() {
  document.querySelectorAll('#settingsBody [data-path]').forEach(el => {
    const path = el.dataset.path.split('.')
    let obj = DATA
    for (let i = 0; i < path.length - 1; i++) {
      if (obj == null) return
      obj = obj[path[i]]
    }
    if (obj == null) return
    let val = el.type === 'number' ? parseFloat(el.value) || 0 : el.value
    obj[path[path.length - 1]] = val
  })
}

function applySettings() {
  try {
    collectSettings()
    collectCartoonAnims()
    saveData()
    rebuild()
    closeSettings()
  } catch (e) {
    alert('应用失败：' + e.message)
    console.error(e)
  }
}

function resetData() {
  if (confirm('确定恢复默认内容？当前修改将丢失。')) {
    localStorage.removeItem(STORAGE_KEY)
    location.reload()
  }
}

function rebuild() {
  if (window._rebuild) window._rebuild()
}

function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('open')
}

function init() {
  let current = 0

  function rebuild() {
    const s = renderSlides()
    stage.innerHTML = s.join('')
    const total = s.length

    navDots.innerHTML = Array.from({ length: total }, (_, i) =>
      `<button class="nav-dot${i === 0 ? ' active' : ''}" data-index="${i}"></button>`
    ).join('')

    if (current >= total) current = total - 1
    document.querySelectorAll('.slide').forEach((el, i) => {
      el.classList.toggle('active', i === current)
    })
    document.querySelectorAll('.nav-dot').forEach((el, i) => {
      el.classList.toggle('active', i === current)
    })
    counter.textContent = `${current + 1} / ${total}`
    window._totalSlides = total
    updateCartoonText()
  }

  rebuild()

  function goTo(index) {
    const total = window._totalSlides || document.querySelectorAll('.slide').length
    if (index < 0 || index >= total) return
    document.querySelectorAll('.slide').forEach((el, i) => {
      el.classList.toggle('active', i === index)
    })
    document.querySelectorAll('.nav-dot').forEach((el, i) => {
      el.classList.toggle('active', i === index)
    })
    current = index
    counter.textContent = `${current + 1} / ${total}`
  }

  document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1))
  document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1))
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(current - 1)
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') goTo(current + 1)
  })
  navDots.addEventListener('click', e => {
    const dot = e.target.closest('.nav-dot')
    if (dot) goTo(parseInt(dot.dataset.index))
  })

  document.getElementById('settingsBtn').addEventListener('click', () => {
    renderSettings()
    document.getElementById('settingsOverlay').classList.add('open')
  })
  document.getElementById('settingsReset').addEventListener('click', resetData)
  document.getElementById('settingsCancel').addEventListener('click', closeSettings)
  document.getElementById('settingsApply').addEventListener('click', applySettings)
  document.getElementById('settingsOverlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeSettings()
  })

  window._rebuild = rebuild

  function scale() {
    const sw = 1920, sh = 1080
    const sx = window.innerWidth / sw, sy = window.innerHeight / sh
    const s = Math.min(sx, sy)
    stage.style.transform = `scale(${s})`
    stage.style.transformOrigin = '0 0'
    const top = (window.innerHeight - sh * s) / 2
    stage.style.marginTop = top > 0 ? `${top}px` : '0'
  }
  window.addEventListener('resize', scale)
  scale()
}

const stage = document.getElementById('stage')
const navDots = document.getElementById('navDots')
const counter = document.getElementById('navCounter')
</script>
